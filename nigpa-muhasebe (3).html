<script>
    // Bu dosya bağımsız (standalone) bir HTML dosyası olarak çalışabilsin diye,
    // orijinal uygulamanın kullandığı window.storage API'si burada tarayıcının
    // localStorage'ı üzerinden aynı arayüzle (get/set, Promise tabanlı) yeniden
    // oluşturuluyor. Uygulamanın iç mantığı (hesaplamalar, ekranlar, kayıt akışı)
    // hiç değiştirilmedi — sadece veri saklama katmanı tarayıcıda çalışacak hale getirildi.
    if (!window.storage) {
      window.storage = {
        get: function (key) {
          return new Promise(function (resolve, reject) {
            try {
              var v = window.localStorage.getItem(key);
              if (v === null || v === undefined) {
                reject(new Error("Anahtar bulunamadı: " + key));
                return;
              }
              resolve({ key: key, value: v, shared: false });
            } catch (e) {
              reject(e);
            }
          });
        },
        set: function (key, value) {
          return new Promise(function (resolve, reject) {
            try {
              window.localStorage.setItem(key, value);
              resolve({ key: key, value: value, shared: false });
            } catch (e) {
              reject(e);
            }
          });
        }
      };
    }
</script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef } = React;
const {
  Menu, X, LayoutDashboard, Package, Building2, ShoppingCart, Undo2,

/* ---------------------------------------------------------------
   Defter — Küçük işletmeler için muhasebe paneli
   Tek dosyalık React uygulaması. Veriler tarayıcı oturumu boyunca
   window.storage üzerinden saklanır (kişisel, paylaşılmaz).
----------------------------------------------------------------*/

const STORAGE_KEY = "defter-app-data-v1";
const CLOUD_CODE_KEY = "defter-cloud-code-v1";
const CLOUD_META_KEY = "defter-cloud-syncmeta-v1";
const CLOUD_LAST_KEY = "defter-cloud-lastsync-v1";
const CLOUD_API = "https://jsonblob.com/api/jsonBlob";

// Ortak kayıt (paylaşımlı senkron) hangi koleksiyonları kapsıyor.
// id'li kayıt dizileri (ürün, satış, firma...) kayıt bazında birleştirilir;
// düz metin dizileri (kategori adları) birleşim (union) olarak birleştirilir.
const ID_ARRAY_KEYS = ["products", "companies", "bankAccounts", "stockMovements", "sales", "returns", "incomes", "expenses", "collections", "bankTransactions"];
const STRING_ARRAY_KEYS = ["incomeCategories", "expenseCategories"];

// Bir kayıt dizisine yeni/değişen öğeler eklendiğinde otomatik "updatedAt"
// damgası basar. Böylece iki cihazdan gelen veriler birleştirilirken hangi
// kaydın daha güncel olduğu anlaşılabilir. Değişmeyen öğelere dokunmaz.
function stampChanges(prevArr, nextArr) {
  if (!Array.isArray(nextArr)) return nextArr;
  if (nextArr.length && (typeof nextArr[0] !== "object" || nextArr[0] === null)) return nextArr;
  const prevById = new Map((Array.isArray(prevArr) ? prevArr : []).map((x) => [x.id, x]));
  const now = Date.now();
  return nextArr.map((item) => {
    if (!item || typeof item !== "object" || !item.id) return item;
    const prev = prevById.get(item.id);
    if (!prev) return { ...item, updatedAt: now };
    const { updatedAt: _pu, ...prevRest } = prev;
    const { updatedAt: _nu, ...nextRest } = item;
    return JSON.stringify(prevRest) === JSON.stringify(nextRest) ? item : { ...item, updatedAt: now };
  });
}

// İki cihazdaki (yerel + bulut) aynı koleksiyonu id bazında birleştirir.
// - Kayıt her iki tarafta da varsa: updatedAt'i en yeni olan kazanır.
// - Kayıt sadece bir tarafta varsa ve son senkronda da yoktu: yeni eklenmiş demektir, korunur.
// - Kayıt sadece bir tarafta varsa ama son senkronda vardı: diğer taraf silmiştir, kaldırılır.
function mergeIdArray(localArr, remoteArr, lastIds) {
  const local = Array.isArray(localArr) ? localArr : [];
  const remote = Array.isArray(remoteArr) ? remoteArr : [];
  const lastSet = new Set(lastIds || []);
  const localById = new Map(local.map((x) => [x.id, x]));
  const remoteById = new Map(remote.map((x) => [x.id, x]));
  const allIds = new Set([...localById.keys(), ...remoteById.keys()]);
  const result = [];
  allIds.forEach((id) => {
    const l = localById.get(id);
    const r = remoteById.get(id);
    if (l && r) {
      result.push((r.updatedAt || 0) > (l.updatedAt || 0) ? r : l);
    } else if (l && !r) {
      if (!lastSet.has(id)) result.push(l);
    } else if (r && !l) {
      if (!lastSet.has(id)) result.push(r);
    }
  });
  return result;
}

function mergeData(local, remote, lastSyncMeta) {
  const merged = { ...local };
  const meta = {};
  ID_ARRAY_KEYS.forEach((key) => {
    const mergedArr = mergeIdArray(local[key], remote && remote[key], (lastSyncMeta && lastSyncMeta[key]) || []);
    merged[key] = mergedArr;
    meta[key] = mergedArr.map((x) => x.id);
  });
  STRING_ARRAY_KEYS.forEach((key) => {
    const set = new Set([...(local[key] || []), ...((remote && remote[key]) || [])]);
    merged[key] = Array.from(set);
  });
  return { merged, meta };
}

// Paylaşımlı kayıt için basit, hesap gerektirmeyen bir bulut deposu (jsonblob.com).
// Kod = o depoya ait benzersiz kimlik; karşı tarafla bu kod paylaşılır.
async function cloudCreateBlob(payload) {
  const res = await fetch(CLOUD_API, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error("create-failed");
  const loc = res.headers.get("Location") || res.headers.get("location");
  if (!loc) throw new Error("no-location");
  return loc.split("/").pop();
}

async function cloudGetBlob(code) {
  const res = await fetch(`${CLOUD_API}/${code}`, { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error("not-found");
  return res.json();
}

async function cloudPutBlob(code, payload) {
  const res = await fetch(`${CLOUD_API}/${code}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error("save-failed");
}


const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const localDateStr = (d = new Date()) => {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const todayStr = () => localDateStr();
const fmtTRY = (n) =>
  new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 2 }).format(
    Number.isFinite(n) ? n : 0
  );
const fmtDate = (d) => {
  if (!d) return "-";
  const dt = new Date(d);
  return dt.toLocaleDateString("tr-TR", { day: "2-digit", month: "short", year: "numeric" });
};

const UNITS = ["Adet", "Kg", "Lt", "Kutu", "Paket", "Metre", "Saat"];
const COMPANY_TYPES = ["Müşteri", "Tedarikçi", "Müşteri & Tedarikçi"];
const INCOME_CATEGORIES = ["Satış", "Hizmet Geliri", "Kira Geliri", "Faiz Geliri", "Diğer Gelir"];
const EXPENSE_CATEGORIES = ["Satış İadesi", "Kira Gideri", "Maaş / Bordro", "Fatura (Elektrik/Su/Doğalgaz)", "Ofis Gideri", "Vergi / SGK", "Ulaşım", "Pazarlama", "Diğer Gider"];

      { id: p2, code: "URN-002", name: "Toner Kartuşu HP 26A", unit: "Adet", purchasePrice: 520, salePrice: 699, openingStock: 12, minStock: 5 },
      { id: p3, code: "URN-003", name: "Klasör (Sırt 8cm)", unit: "Adet", purchasePrice: 22, salePrice: 39, openingStock: 3, minStock: 15 },
    ],
    companies: [
      { id: c1, name: "Aydın Ofis Malzemeleri Ltd. Şti.", type: "Müşteri", taxNo: "1234567890", phone: "0212 555 12 34", email: "info@aydinofis.com", address: "Merkez Mah. No:12, İstanbul" },
      { id: c2, name: "Kartal Kırtasiye A.Ş.", type: "Müşteri & Tedarikçi", taxNo: "9876543210", phone: "0216 444 98 76", email: "muhasebe@kartalkirtasiye.com", address: "Sanayi Sit. No:5, İstanbul" },
    ],
    bankAccounts: [
      { id: b1, name: "İşletme Vadesiz Hesap", bankName: "Ziraat Bankası", iban: "TR12 0001 0000 0000 0000 0000 01", openingBalance: 25000 },
    ],
    stockMovements: [],
    sales: [],
    returns: [],
    incomes: [],
    expenses: [],
    collections: [],
    bankTransactions: [],

}

/* ---------------- generic UI bits ---------------- */

function Modal({ title, onClose, children, wide }) {
  return (
    <div className="ov" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={"modal" + (wide ? " wide" : "")}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="icon-btn" onClick={onClose} aria-label="Kapat"><X size={18} /></button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function DangerButton({ onConfirm, label = "Sil", confirmLabel = "Emin misiniz?" }) {
  const [armed, setArmed] = useState(false);
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);
  return armed ? (
    <button
      className="btn btn-danger-solid"
      onClick={() => { setArmed(false); onConfirm(); }}
      onMouseLeave={() => setArmed(false)}
    >
      {confirmLabel}
    </button>
  ) : (
    <button
      className="btn btn-ghost-danger"
      onClick={() => { setArmed(true); timer.current = setTimeout(() => setArmed(false), 3000); }}
    >
      <Trash2 size={14} /> {label}
    </button>
  );
}

function Empty({ icon: Icon, title, hint }) {
  return (
    <div className="empty">
      <Icon size={28} strokeWidth={1.4} />
      <p className="empty-title">{title}</p>
      {hint && <p className="empty-hint">{hint}</p>}
    </div>
  );
}

function Field({ label, children }) {
  return (
    <label className="field">
      <span>{label}</span>
      {children}
    </label>
  );
}

function StatCard({ label, value, icon: Icon, tone }) {
  return (
    <div className={"stat-card tone-" + tone}>
      <div className="stat-icon"><Icon size={17} /></div>
      <div>
        <div className="stat-label">{label}</div>

      </div>
    </div>

}

/* ---------------- main app ---------------- */

function DefterApp() {
  const [data, setData] = useState(seedData());
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("panel");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [syncState, setSyncState] = useState("idle"); // idle | saving | saved

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          // merge onto fresh defaults so new fields (e.g. categories) never go missing
          const merged = { ...seedData(), ...parsed };
          // --- one-time migration: sales that were marked "ödendi" under the old
          // payment-at-sale flow but have no matching collection would otherwise
          // look unpaid under the new model (payment is always collected separately
          // now). Backfill a matching collection so old data keeps its correct balance.
          const legacyPaidSales = (merged.sales || []).filter(
            (s) => s.paymentStatus === "odendi" && !(merged.collections || []).some((c) => c.saleId === s.id)
          );
          if (legacyPaidSales.length > 0) {
            const backfill = legacyPaidSales.map((s) => {
              const total = s.items.reduce((a, it) => a + it.qty * it.price, 0);
              return { id: uid(), companyId: s.companyId, saleId: s.id, date: s.date, amount: total, bankAccountId: s.bankAccountId || "", note: "Satış anında tahsil edilmiş (otomatik aktarıldı)" };
            });
            merged.collections = [...(merged.collections || []), ...backfill];
          }
          setData(merged);
        }
      } catch (e) {
        /* no saved data yet on this account, keep starter data */
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSyncState("saving");
    const t = setTimeout(() => {
      window.storage
        .set(STORAGE_KEY, JSON.stringify(data))
        .then(() => setSyncState("saved"))
        .catch(() => setSyncState("idle"));
    }, 400);
    return () => clearTimeout(t);
  }, [data, loaded]);

  const update = (key, fn) => setData((d) => ({ ...d, [key]: stampChanges(d[key], fn(d[key])) }));

  /* ---------- ortak kayıt (bulut senkronizasyonu) ---------- */

  const [cloudCode, setCloudCode] = useState(() => window.localStorage.getItem(CLOUD_CODE_KEY) || "");
  const [cloudBusy, setCloudBusy] = useState(false);
  const [cloudMsg, setCloudMsg] = useState("");
  const [cloudMsgType, setCloudMsgType] = useState("info");
  const [lastSyncAt, setLastSyncAt] = useState(() => {
    const v = window.localStorage.getItem(CLOUD_LAST_KEY);
    return v ? Number(v) : null;
  });
  const [joinInput, setJoinInput] = useState("");

  const readSyncMeta = () => {
    try {
      return JSON.parse(window.localStorage.getItem(CLOUD_META_KEY) || "{}");
    } catch (e) {
      return {};
    }
  };
  const writeSyncMeta = (meta) => window.localStorage.setItem(CLOUD_META_KEY, JSON.stringify(meta));
  const markSynced = () => {
    const now = Date.now();
    setLastSyncAt(now);
    window.localStorage.setItem(CLOUD_LAST_KEY, String(now));
  };

  async function handleStartSharedRecord() {
    setCloudBusy(true);
    setCloudMsg("");
    try {
      const code = await cloudCreateBlob(data);
      setCloudCode(code);
      window.localStorage.setItem(CLOUD_CODE_KEY, code);
      const meta = {};
      ID_ARRAY_KEYS.forEach((k) => (meta[k] = (data[k] || []).map((x) => x.id)));
      writeSyncMeta(meta);
      markSynced();
      setCloudMsgType("success");
      setCloudMsg("Ortak kayıt oluşturuldu. Kodu karşı tarafla paylaşın.");
    } catch (e) {
      setCloudMsgType("error");
      setCloudMsg("Bağlantı kurulamadı. İnternetinizi kontrol edip tekrar deneyin.");
    } finally {
      setCloudBusy(false);
    }
  }

  async function handleJoinSharedRecord() {
    const code = joinInput.trim();
    if (!code) return;
    setCloudBusy(true);
    setCloudMsg("");
    try {
      const remote = await cloudGetBlob(code);
      const { merged, meta } = mergeData(data, remote, {});
      await cloudPutBlob(code, merged);
      setData(merged);
      setCloudCode(code);
      window.localStorage.setItem(CLOUD_CODE_KEY, code);
      writeSyncMeta(meta);
      markSynced();
      setJoinInput("");
      setCloudMsgType("success");
      setCloudMsg("Koda bağlanıldı, kayıtlar birleştirildi.");
    } catch (e) {
      setCloudMsgType("error");
      setCloudMsg("Kod bulunamadı ya da bağlantı kurulamadı.");
    } finally {
      setCloudBusy(false);
    }
  }

  async function handleSyncNow() {
    if (!cloudCode) return;
    setCloudBusy(true);
    setCloudMsg("");
    try {
      const remote = await cloudGetBlob(cloudCode);
      const lastMeta = readSyncMeta();
      const { merged, meta } = mergeData(data, remote, lastMeta);
      await cloudPutBlob(cloudCode, merged);
      setData(merged);
      writeSyncMeta(meta);
      markSynced();
      setCloudMsgType("success");
      setCloudMsg("Senkronize edildi.");
    } catch (e) {
      setCloudMsgType("error");
      setCloudMsg("Senkronizasyon başarısız. İnternetinizi kontrol edin.");
    } finally {
      setCloudBusy(false);
    }
  }

  function handleDisconnectCloud() {
    setCloudCode("");
    window.localStorage.removeItem(CLOUD_CODE_KEY);
    window.localStorage.removeItem(CLOUD_META_KEY);
    window.localStorage.removeItem(CLOUD_LAST_KEY);
    setLastSyncAt(null);
    setCloudMsg("");
  }

  // Uygulama açıldığında, daha önce bir ortak kayıt koduna bağlanılmışsa
  // otomatik olarak bir kez senkronize et.
  useEffect(() => {
    if (loaded && cloudCode) {
      handleSyncNow();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  // Ortak kayda bağlıyken karşı tarafın girdiği bilgiler otomatik yansısın diye
  // arka planda belirli aralıklarla (ve sekme tekrar öne geldiğinde) kendiliğinden
  // senkronize eder — kullanıcı butona basmayı unutsa bile veriler güncel kalır.
  useEffect(() => {
    if (!loaded || !cloudCode) return;
    const interval = setInterval(() => {
      if (!document.hidden) handleSyncNow();
    }, 30000);
    const onFocus = () => handleSyncNow();
    const onVisible = () => { if (!document.hidden) handleSyncNow(); };
    window.addEventListener("focus", onFocus);
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      clearInterval(interval);
      window.removeEventListener("focus", onFocus);
      document.removeEventListener("visibilitychange", onVisible);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, cloudCode]);

  /* ---------- derived calculations ---------- */

  const stockOf = (productId) => {
    const p = data.products.find((x) => x.id === productId);
    if (!p) return 0;
    let s = p.openingStock;
    for (const m of data.stockMovements) {
      if (m.productId !== productId) continue;
      if (m.type === "satis") s -= m.qty;
      else s += m.qty; // giris, iade, sayim
    }
    return s;
  };

  const companyBalance = (companyId) => {
    const salesTotal = data.sales.filter((s) => s.companyId === companyId).reduce((a, s) => a + saleTotal(s), 0);
    const returnsTotal = data.returns.filter((r) => r.companyId === companyId).reduce((a, r) => a + returnTotal(r), 0);
    const collected = data.collections.filter((c) => c.companyId === companyId).reduce((a, c) => a + c.amount, 0);
    return salesTotal - returnsTotal - collected;
  };

  const bankBalance = (accountId) => {
    const acc = data.bankAccounts.find((a) => a.id === accountId);
    if (!acc) return 0;
    let b = acc.openingBalance;
    for (const t of data.bankTransactions) {
      if (t.accountId !== accountId) continue;
      b += t.type === "giris" ? t.amount : -t.amount;
    }
    return b;
  };

  const lineTotal = (item) => item.qty * item.price;
  const saleTotal = (s) => s.items.reduce((a, it) => a + lineTotal(it), 0);
  const returnTotal = (r) => r.items.reduce((a, it) => a + lineTotal(it), 0);

  const totals = useMemo(() => {
    const income = incomeRecords(data).reduce((a, i) => a + i.amount, 0);
    const expense = data.expenses.reduce((a, e) => a + e.amount, 0);
    const salesCount = data.sales.length;
    const bank = data.bankAccounts.reduce((a, acc) => a + bankBalance(acc.id), 0);
    const lowStock = data.products.filter((p) => stockOf(p.id) <= p.minStock);
    const receivable = data.companies.reduce((a, c) => a + Math.max(companyBalance(c.id), 0), 0);
    const all = summarizePeriod(data, "");
    return { income, expense, net: all.profit, grossProfit: all.grossProfit, salesCount, bank, lowStock, receivable };
  }, [data]);

  /* ---------- cascading create/delete helpers ---------- */

  function addSale(sale) {
    update("sales", (arr) => [...arr, sale]);
    update("stockMovements", (arr) => [
      ...arr,
      ...sale.items.map((it) => ({ id: uid(), productId: it.productId, type: "satis", qty: it.qty, date: sale.date, relatedId: sale.id })),
    ]);
    // Satış gelir SAYILMAZ: tahsilat girildiğinde gelire dönüşür (bkz. incomeRecords).
  }

  function updateSale(id, f) {
    const old = data.sales.find((s) => s.id === id);
    update("sales", (arr) => arr.map((s) => (s.id === id ? { ...s, date: f.date, companyId: f.companyId, items: f.items } : s)));
    update("stockMovements", (arr) => [
      ...arr.filter((m) => m.relatedId !== id),
      ...f.items.map((it) => ({ id: uid(), productId: it.productId, type: "satis", qty: it.qty, date: f.date, relatedId: id })),
    ]);
    if (old && old.companyId !== f.companyId) { // firma değiştiyse bağlı tahsilat/iadeler de yeni firmaya geçer
      const retIds = data.returns.filter((r) => r.saleId === id).map((r) => r.id);
      update("collections", (arr) => arr.map((c) => (c.saleId === id ? { ...c, companyId: f.companyId } : c)));
      update("returns", (arr) => arr.map((r) => (r.saleId === id ? { ...r, companyId: f.companyId } : r)));
      update("expenses", (arr) => arr.map((e) => (retIds.includes(e.relatedId) ? { ...e, companyId: f.companyId } : e)));
    }
  }

  function updateReturn(id, ret) {
    update("returns", (arr) => arr.map((r) => (r.id === id ? { ...r, ...ret } : r)));
    update("stockMovements", (arr) => [
      ...arr.filter((m) => m.relatedId !== id),
      ...ret.items.map((it) => ({ id: uid(), productId: it.productId, type: "iade", qty: it.qty, date: ret.date, relatedId: id })),
    ]);
    const total = returnTotal(ret);
    const companyName = data.companies.find((c) => c.id === ret.companyId)?.name || "Firma";
    update("expenses", (arr) => arr.map((e) => (e.relatedId === id ? { ...e, date: ret.date, amount: total, companyId: ret.companyId } : e)));
    replaceBankTx(id, ret.bankAccountId ? { accountId: ret.bankAccountId, date: ret.date, type: "cikis", amount: total, description: `İade ödemesi — ${companyName} (${ret.no})`, source: "iade" } : null);
  }

  function deleteSale(id) {
    update("sales", (arr) => arr.filter((s) => s.id !== id));
    update("stockMovements", (arr) => arr.filter((m) => m.relatedId !== id));
    update("incomes", (arr) => arr.filter((i) => i.relatedId !== id));
    update("bankTransactions", (arr) => arr.filter((t) => t.relatedId !== id));
  }

  function addReturn(ret) {
    update("returns", (arr) => [...arr, ret]);
    update("stockMovements", (arr) => [
      ...arr,
      ...ret.items.map((it) => ({ id: uid(), productId: it.productId, type: "iade", qty: it.qty, date: ret.date, relatedId: ret.id })),
    ]);
    const total = returnTotal(ret);
    const companyName = data.companies.find((c) => c.id === ret.companyId)?.name || "Firma";
    update("expenses", (arr) => [
      ...arr,
      { id: uid(), date: ret.date, description: `Satış iadesi — ${companyName} (${ret.no})`, category: "Satış İadesi", amount: total, companyId: ret.companyId, source: "iade", relatedId: ret.id },
    ]);
    if (ret.bankAccountId) {
      update("bankTransactions", (arr) => [
        ...arr,
        { id: uid(), accountId: ret.bankAccountId, date: ret.date, type: "cikis", amount: total, description: `İade ödemesi — ${companyName} (${ret.no})`, source: "iade", relatedId: ret.id },
      ]);
    }
  }

  function deleteReturn(id) {
    update("returns", (arr) => arr.filter((r) => r.id !== id));
    update("stockMovements", (arr) => arr.filter((m) => m.relatedId !== id));
    update("expenses", (arr) => arr.filter((e) => e.relatedId !== id));
    update("bankTransactions", (arr) => arr.filter((t) => t.relatedId !== id));
  }

  function addManualIncome(inc) {
    const id = uid();
    update("incomes", (arr) => [...arr, { ...inc, id, source: "manuel" }]);
    if (inc.bankAccountId) {
      update("bankTransactions", (arr) => [...arr, { id: uid(), accountId: inc.bankAccountId, date: inc.date, type: "giris", amount: inc.amount, description: inc.description || "Gelir", source: "gelir", relatedId: id }]);
    }
  }
  function deleteIncome(id) {
    update("incomes", (arr) => arr.filter((i) => i.id !== id));
    update("bankTransactions", (arr) => arr.filter((t) => t.relatedId !== id));
  }

  function addManualExpense(exp) {
    const id = uid();
    update("expenses", (arr) => [...arr, { ...exp, id, source: "manuel" }]);
    if (exp.bankAccountId) {
      update("bankTransactions", (arr) => [...arr, { id: uid(), accountId: exp.bankAccountId, date: exp.date, type: "cikis", amount: exp.amount, description: exp.description || "Gider", source: "gider", relatedId: id }]);
    }
  }
  function deleteExpense(id) {
    update("expenses", (arr) => arr.filter((e) => e.id !== id));
    update("bankTransactions", (arr) => arr.filter((t) => t.relatedId !== id));
  }

  function addCollection(col) {
    const id = uid();
    update("collections", (arr) => [...arr, { ...col, id }]);
    if (col.bankAccountId) {
      const desc = col.note ? `Tahsilat — ${col.note}` : "Cari tahsilat";
      update("bankTransactions", (arr) => [...arr, { id: uid(), accountId: col.bankAccountId, date: col.date, type: "giris", amount: col.amount, description: desc, source: "tahsilat", relatedId: id }]);
    }
  }
  function deleteCollection(id) {
    update("collections", (arr) => arr.filter((c) => c.id !== id));
    update("bankTransactions", (arr) => arr.filter((t) => t.relatedId !== id));
  }

  // Düzeltme: kaydı güncelle, bağlı banka hareketini silip yeniden oluştur.
  function replaceBankTx(relatedId, tx) {
    update("bankTransactions", (arr) => {
      const rest = arr.filter((t) => t.relatedId !== relatedId);
      return tx ? [...rest, { id: uid(), ...tx, relatedId }] : rest;
    });
  }
  function updateManualIncome(id, f) {
    update("incomes", (arr) => arr.map((i) => (i.id === id ? { ...i, ...f } : i)));
    replaceBankTx(id, f.bankAccountId ? { accountId: f.bankAccountId, date: f.date, type: "giris", amount: f.amount, description: f.description || "Gelir", source: "gelir" } : null);
  }
  function updateManualExpense(id, f) {
    update("expenses", (arr) => arr.map((e) => (e.id === id ? { ...e, ...f } : e)));
    replaceBankTx(id, f.bankAccountId ? { accountId: f.bankAccountId, date: f.date, type: "cikis", amount: f.amount, description: f.description || "Gider", source: "gider" } : null);
  }
  function updateCollection(id, f) {
    const fields = { date: f.date, amount: f.amount, bankAccountId: f.bankAccountId || "", note: f.note || "" };
    update("collections", (arr) => arr.map((c) => (c.id === id ? { ...c, ...fields } : c)));
    replaceBankTx(id, fields.bankAccountId ? { accountId: fields.bankAccountId, date: fields.date, type: "giris", amount: fields.amount, description: fields.note ? `Tahsilat — ${fields.note}` : "Cari tahsilat", source: "tahsilat" } : null);
  }

  function addIncomeCategory(name) {
    const clean = name.trim();
    if (!clean) return;
    update("incomeCategories", (arr) => (arr.includes(clean) ? arr : [...arr, clean]));
  }
  function removeIncomeCategory(name) {
    update("incomeCategories", (arr) => arr.filter((c) => c !== name));
  }
  function renameIncomeCategory(oldName, newName) {
    const clean = newName.trim();
    if (!clean || clean === oldName) return;
    update("incomeCategories", (arr) => arr.map((c) => (c === oldName ? clean : c)));
    update("incomes", (arr) => arr.map((i) => (i.category === oldName ? { ...i, category: clean } : i)));
  }
  function addExpenseCategory(name) {
    const clean = name.trim();
    if (!clean) return;
    update("expenseCategories", (arr) => (arr.includes(clean) ? arr : [...arr, clean]));
  }
  function removeExpenseCategory(name) {
    update("expenseCategories", (arr) => arr.filter((c) => c !== name));
  }
  function renameExpenseCategory(oldName, newName) {
    const clean = newName.trim();
    if (!clean || clean === oldName) return;
    update("expenseCategories", (arr) => arr.map((c) => (c === oldName ? clean : c)));
    update("expenses", (arr) => arr.map((e) => (e.category === oldName ? { ...e, category: clean } : e)));
  }

  function exportExcel() {
    const wb = XLSX.utils.book_new();

    const productsSheet = data.products.map((p) => ({
      Kod: p.code, "Ürün Adı": p.name, Birim: p.unit,
      "Alış Fiyatı": p.purchasePrice, "Satış Fiyatı": p.salePrice,
      "Güncel Stok": stockOf(p.id), "Min. Stok": p.minStock,
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(productsSheet), "Ürünler");

    const companiesSheet = data.companies.map((c) => ({
      "Firma Adı": c.name, Tür: c.type, "Vergi No": c.taxNo, Telefon: c.phone,
      "E-posta": c.email, Adres: c.address, "Cari Bakiye": companyBalance(c.id),
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(companiesSheet), "Firmalar");

    const salesSheet = data.sales.map((s) => {
      const c = data.companies.find((x) => x.id === s.companyId);
      const total = saleTotal(s);
      const collected = data.collections.filter((col) => col.saleId === s.id).reduce((a, col) => a + col.amount, 0);
      const remaining = total - collected;
      const status = remaining <= 0.005 ? "Ödendi" : collected > 0 ? "Kısmi ödeme" : "Açık hesap";
      return {
        "Satış No": s.no, Tarih: fmtDate(s.date), Firma: c ? c.name : "-",
        "Ödeme Durumu": status, "Tahsil Edilen": collected, "Kalan": Math.max(remaining, 0),
        "Kalem Sayısı": s.items.length, "Genel Toplam": total,
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salesSheet), "Satışlar");

    const salesDetailSheet = [];
    data.sales.forEach((s) => {
      const c = data.companies.find((x) => x.id === s.companyId);
      s.items.forEach((it) => {
        const p = data.products.find((x) => x.id === it.productId);
        salesDetailSheet.push({
          "Satış No": s.no, Tarih: fmtDate(s.date), Firma: c ? c.name : "-",
          Ürün: p ? p.name : "Silinmiş ürün", Miktar: it.qty, "Birim Fiyat": it.price,
          Tutar: lineTotal(it),
        });
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salesDetailSheet), "Satış Detay");

    const returnsSheet = data.returns.map((r) => {
      const c = data.companies.find((x) => x.id === r.companyId);
      const s = data.sales.find((x) => x.id === r.saleId);
      return {
        "İade No": r.no, Tarih: fmtDate(r.date), Firma: c ? c.name : "-",
        "İlgili Satış": s ? s.no : "Manuel", Tutar: returnTotal(r),
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(returnsSheet), "İadeler");

    const collectionsSheet = data.collections.map((col) => {
      const c = data.companies.find((x) => x.id === col.companyId);
      const s = data.sales.find((x) => x.id === col.saleId);
      return {
        Tarih: fmtDate(col.date), Firma: c ? c.name : "-",
        "İlgili Satış": s ? s.no : "Genel", "Sebep / Açıklama": col.note || "-", Tutar: col.amount,
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(collectionsSheet), "Tahsilatlar");

    const incomeSheet = incomeRecords(data).map((i) => ({
      Tarih: fmtDate(i.date), Açıklama: i.description, Kategori: i.category,
      Kaynak: i.source === "tahsilat" ? "Tahsilat" : "Manuel", Ödeme: i.bankAccountId ? "Banka" : "Nakit", Tutar: i.amount,
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(incomeSheet), "Gelir");

    const expenseSheet = data.expenses.map((e) => ({
      Tarih: fmtDate(e.date), Açıklama: e.description, Kategori: e.category,
      Kaynak: e.source === "iade" ? "Otomatik (iade)" : "Manuel", Tutar: e.amount,
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenseSheet), "Gider");

    const bankAccSheet = data.bankAccounts.map((b) => ({
      "Hesap Adı": b.name, Banka: b.bankName, IBAN: b.iban,
      "Açılış Bakiyesi": b.openingBalance, "Güncel Bakiye": bankBalance(b.id),
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bankAccSheet), "Banka Hesapları");

    const bankTxSheet = data.bankTransactions.map((t) => {
      const acc = data.bankAccounts.find((a) => a.id === t.accountId);
      return {
        Tarih: fmtDate(t.date), Hesap: acc ? acc.name : "-",
        Tür: t.type === "giris" ? "Giriş" : "Çıkış", Tutar: t.amount,
        Açıklama: t.description, Kaynak: t.source,
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bankTxSheet), "Banka İşlemleri");

    const yr = new Date().getFullYear();
    const monthlySheet = MONTHS.map((name, i) => {
      const s = summarizePeriod(data, `${yr}-${String(i + 1).padStart(2, "0")}`);
      return { Ay: name, "Satış Adedi": s.salesCount, Satış: s.sales, İade: s.returns, Gelir: s.income, "Gelir Nakit": s.incCash, "Gelir Banka": s.incBank, Gider: s.expense, "Satış Kârı": s.grossProfit, "Net Kâr": s.profit, "Tahsilat Nakit": s.colCash, "Tahsilat Banka": s.colBank };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monthlySheet), `Aylık ${yr}`);

    const fileDate = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `Defter-muhasebe-${fileDate}.xlsx`);
  }

  const NAV = [
    { id: "panel", label: "Panel", icon: LayoutDashboard },
    { id: "urunler", label: "Ürünler", icon: Package },
    { id: "stok", label: "Stok", icon: Boxes },
    { id: "firmalar", label: "Firmalar", icon: Building2 },
    { id: "satis", label: "Satış", icon: ShoppingCart },
    { id: "iade", label: "İade", icon: Undo2 },
    { id: "gelir", label: "Gelir", icon: TrendingUp },
    { id: "gider", label: "Gider", icon: TrendingDown },
    { id: "banka", label: "Banka", icon: Landmark },
  ];

  return (
    <div className="app">
      <style>{CSS}</style>

      <button className="hamburger" onClick={() => setSidebarOpen(true)} aria-label="Menüyü aç">
        <Menu size={20} />
      </button>

      {sidebarOpen && <div className="scrim" onClick={() => setSidebarOpen(false)} />}

      <aside className={"sidebar" + (sidebarOpen ? " open" : "")}>
        <div className="brand">
          <div className="brand-mark">N</div>
          <div>
            <div className="brand-name">NİĞPA</div>
            <div className="brand-sub">muhasebe paneli</div>
          </div>
          <button className="icon-btn sidebar-close" onClick={() => setSidebarOpen(false)}><X size={18} /></button>
        </div>
        <nav className="nav">
          {NAV.map((n) => (
            <button
              key={n.id}
              className={"nav-item" + (tab === n.id ? " active" : "")}
              onClick={() => { setTab(n.id); setSidebarOpen(false); }}
            >
              <n.icon size={17} strokeWidth={1.8} />
              <span>{n.label}</span>
            </button>
          ))}
        </nav>
        <div className="sidebar-foot">
          <div className="sync-row">
            <span className={"sync-dot " + syncState} />
            {syncState === "saving" ? "Kaydediliyor…" : "Bu cihazda otomatik kayıtlı"}
          </div>
          Net kâr
          <strong className={totals.net >= 0 ? "pos" : "neg"}>{fmtTRY(totals.net)}</strong>

          <div className="cloud-block">
            <div className="cloud-head"><Cloud size={13} /><span>Ortak kayıt</span></div>

            {!cloudCode && (
              <div className="cloud-setup">
                <p className="cloud-hint">
                  Karşılıklı senkron için: "Yeni ortak kayıt başlat"a bas, çıkan kodu karşı tarafa gönder.
                  O da kodu buraya yapıştırıp bağlansın — bundan sonra ikinizin de girdiği kayıtlar
                  otomatik olarak birbirinize yansır.
                </p>
                <button type="button" className="btn btn-ghost cloud-btn" disabled={cloudBusy} onClick={handleStartSharedRecord}>
                  {cloudBusy ? "Oluşturuluyor…" : "Yeni ortak kayıt başlat"}
                </button>
                <div className="cloud-join-row">
                  <input
                    className="cloud-join-input"
                    placeholder="veya kodu yapıştır"
                    value={joinInput}
                    onChange={(e) => setJoinInput(e.target.value)}
                  />
                  <button type="button" className="icon-btn" title="Koda bağlan" disabled={cloudBusy || !joinInput.trim()} onClick={handleJoinSharedRecord}>
                    <Link2 size={14} />
                  </button>
                </div>
              </div>
            )}

            {cloudCode && (
              <div className="cloud-active">
                <div className="cloud-code-row">
                  <span className="cloud-code mono">{cloudCode}</span>
                  <button type="button" className="icon-btn" title="Kodu kopyala" onClick={() => navigator.clipboard && navigator.clipboard.writeText(cloudCode)}>
                    <Copy size={13} />
                  </button>
                  <button type="button" className="icon-btn" title="Bağlantıyı kaldır" onClick={handleDisconnectCloud}>
                    <Unlink size={13} />
                  </button>
                </div>
                <button type="button" className="btn btn-primary cloud-sync-btn" disabled={cloudBusy} onClick={handleSyncNow}>
                  <RefreshCw size={14} className={cloudBusy ? "spin" : ""} />
                  {cloudBusy ? "Senkronize ediliyor…" : "Kaydet ve Senkronize Et"}
                </button>
                <div className="cloud-status">
                  {lastSyncAt ? "Son senkron: " + new Date(lastSyncAt).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }) : "Henüz senkronize edilmedi"}
                  <br />Otomatik senkron açık (30 sn'de bir)
                </div>
              </div>
            )}

            {cloudMsg && <div className={"cloud-msg " + cloudMsgType}>{cloudMsg}</div>}
          </div>
        </div>
      </aside>

      <button className="export-fab" onClick={exportExcel} title="Verileri Excel olarak indir">
        <Download size={15} /> <span className="export-fab-label">Excel'e Aktar</span>
      </button>

      <main className="main">
        {tab === "panel" && <Panel data={data} totals={totals} stockOf={stockOf} bankBalance={bankBalance} companyBalance={companyBalance} setTab={setTab} />}
        {tab === "urunler" && <Urunler data={data} update={update} stockOf={stockOf} />}
        {tab === "stok" && <Stok data={data} update={update} stockOf={stockOf} />}
        {tab === "firmalar" && <Firmalar data={data} update={update} companyBalance={companyBalance} addCollection={addCollection} deleteCollection={deleteCollection} updateCollection={updateCollection} bankAccounts={data.bankAccounts} />}
        {tab === "satis" && <Satis data={data} addSale={addSale} updateSale={updateSale} deleteSale={deleteSale} addCollection={addCollection} saleTotal={saleTotal} stockOf={stockOf} />}
        {tab === "iade" && <Iade data={data} addReturn={addReturn} updateReturn={updateReturn} deleteReturn={deleteReturn} saleTotal={saleTotal} returnTotal={returnTotal} />}
        {tab === "gelir" && (
          <Gelir
            data={data}
            addManualIncome={addManualIncome}
            deleteIncome={deleteIncome}
            deleteCollection={deleteCollection}
            updateManualIncome={updateManualIncome}
            updateCollection={updateCollection}
            addCollection={addCollection}
            bankBalance={bankBalance}
            categories={data.incomeCategories}
            addCategory={addIncomeCategory}
            removeCategory={removeIncomeCategory}
            renameCategory={renameIncomeCategory}
          />
        )}
        {tab === "gider" && (
          <Gider
            data={data}
            addManualExpense={addManualExpense}
            deleteExpense={deleteExpense}
            updateManualExpense={updateManualExpense}
            categories={data.expenseCategories}
            addCategory={addExpenseCategory}
            removeCategory={removeExpenseCategory}
            renameCategory={renameExpenseCategory}
          />
        )}
        {tab === "banka" && <Banka data={data} update={update} bankBalance={bankBalance} />}
      </main>
    </div>
  );
}

/* ================= PANEL (Dashboard) ================= */

const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

/* GELİR KAYITLARI = elle eklenen gelirler + tahsilatlar.
   Satış faturası tek başına gelir SAYILMAZ; para tahsil edilince (tahsilat girilince)
   gelire dönüşür. Eski sürümden kalan otomatik "satış geliri" kayıtları yok sayılır. */
function incomeRecords(data) {
  const manual = data.incomes.filter((i) => i.source !== "satis");
  const fromCollections = data.collections.map((c) => {
    const co = data.companies.find((x) => x.id === c.companyId);
    const sale = data.sales.find((x) => x.id === c.saleId);
    const desc = `Tahsilat — ${co ? co.name : "Firma"}${sale ? ` (${sale.no})` : ""}${c.note ? " · " + c.note : ""}`;
    return { id: c.id, date: c.date, description: desc, category: "Tahsilat", amount: c.amount, companyId: c.companyId, bankAccountId: c.bankAccountId || "", source: "tahsilat" };
  });
  return [...manual, ...fromCollections];
}

function periodFilter(prefix) {
  return typeof prefix === "string"
    ? (x) => typeof x.date === "string" && x.date.startsWith(prefix)
    : (x) => typeof x.date === "string" && x.date >= prefix.from && x.date <= prefix.to; // {from,to} = hafta aralığı
}

// Kalemin alış maliyeti: satış anında kaydedilen değer, yoksa ürünün güncel alış fiyatı
function itemCost(data, it) {
  if (it.cost !== undefined && it.cost !== null) return Number(it.cost) || 0;
  const p = data.products.find((x) => x.id === it.productId);
  return p ? Number(p.purchasePrice) || 0 : 0;
}

/* ---------------------------------------------------------------
   KÂR ALGORİTMASI (tahsilata bağlı kâr)
   Adım 1: Her satış için  gelir R = Σ adet×satış fiyatı,  maliyet C = Σ adet×alış fiyatı.
           Satışa bağlı iadeler hem R'den hem C'den düşülür.
           Net gelir R', net marj M' = (R − C) − (iade geliri − iade maliyeti).
           Kâr oranı = M' / R'.   Tahsil edilebilecek üst sınır = R'.
   Adım 2: Satışa bağlı tahsilatlar önce kendi satışına uygulanır.
   Adım 3: Satışa bağlı olmayan (cari) tahsilatlar ve artan tutarlar, firmanın
           en eski açık satışlarından başlayarak dağıtılır (FIFO).
   Adım 4: Bir tahsilatın kârı = satışa uygulanan tutar × o satışın kâr oranı.
           Yani tahsilat girildikçe kâr artar; tahsilat yoksa kâr 0'dır.
   Çıktı : { col: {tahsilatId: kâr}, sale: {satışId: gerçekleşen kâr}, pot: {satışId: toplam kâr} }
----------------------------------------------------------------*/
const _profitCache = new WeakMap();
function collectionProfits(data) {
  if (_profitCache.has(data)) return _profitCache.get(data);
  const st = {};
  data.sales.forEach((s) => {
    const rev = s.items.reduce((a, it) => a + it.qty * it.price, 0);
    const cost = s.items.reduce((a, it) => a + it.qty * itemCost(data, it), 0);
    let rRev = 0, rCost = 0;
    data.returns.filter((r) => r.saleId === s.id).forEach((r) => r.items.forEach((it) => { rRev += it.qty * it.price; rCost += it.qty * itemCost(data, it); }));
    const netRev = rev - rRev;
    const margin = rev - cost - (rRev - rCost);
    st[s.id] = { companyId: s.companyId, date: s.date, cap: Math.max(netRev, 0), ratio: netRev > 0 ? margin / netRev : 0, margin: netRev > 0 ? margin : 0 };
  });
  const res = { col: {}, sale: {}, pot: {} };
  Object.entries(st).forEach(([sid, s]) => { res.pot[sid] = s.margin; });
  const left = {};
  const apply = (c, sid) => {
    const s = st[sid];
    if (!s || left[c.id] <= 0) return;
    const x = Math.min(left[c.id], s.cap);
    s.cap -= x; left[c.id] -= x;
    res.col[c.id] = (res.col[c.id] || 0) + x * s.ratio;
    res.sale[sid] = (res.sale[sid] || 0) + x * s.ratio;
  };
  const cols = [...data.collections].sort((a, b) => a.date.localeCompare(b.date));
  cols.forEach((c) => { left[c.id] = Number(c.amount) || 0; res.col[c.id] = 0; });
  cols.forEach((c) => { if (c.saleId && st[c.saleId]) apply(c, c.saleId); }); // adım 2
  cols.forEach((c) => { // adım 3
    if (left[c.id] <= 0) return;
    Object.keys(st).filter((sid) => st[sid].companyId === c.companyId).sort((a, b) => st[a].date.localeCompare(st[b].date)).forEach((sid) => apply(c, sid));
  });
  _profitCache.set(data, res);
  return res;
}

/* ---------------------------------------------------------------
   DÖNEM ÖZET ALGORİTMASI (gün de ay da aynı mantık)
   Girdi : tüm kayıtlar + tarih öneki ("2026-09-18" = gün, "2026-09" = ay) ya da {from,to} = hafta
   Adım 1: Her kayıt listesini date.startsWith(önek) ile süz.
   Adım 2: Satış = fatura toplamı (gelir DEĞİL, alacak oluşturur). İade ayrı toplanır.
   Adım 3: Gelir = elle gelir + tahsilat. bankAccountId doluysa BANKA, boşsa NAKİT.
   Adım 4: Gider = gider kayıtları. Satış kârı = tahsilatların kâr payı (yukarıdaki algoritma).
           Net kâr = satış kârı + elle eklenen gelir - gider (iade giderleri hariç: iade,
           satış kârından zaten düşüldüğü için ikinci kez sayılmaz).
   Adım 5: Banka giriş/çıkış = banka hareketleri (hesaplar arası transfer hariç).
----------------------------------------------------------------*/
function summarizePeriod(data, prefix) {
  const inP = periodFilter(prefix);
  const sum = (arr) => arr.reduce((a, x) => a + (Number(x.amount) || 0), 0);
  const docTotal = (d) => d.items.reduce((a, it) => a + it.qty * it.price, 0);
  const sales = data.sales.filter(inP);
  const rets = data.returns.filter(inP);
  const incs = incomeRecords(data).filter(inP);
  const exps = data.expenses.filter(inP);
  const cols = data.collections.filter(inP);
  const tx = data.bankTransactions.filter((t) => inP(t) && t.source !== "transfer");
  const income = sum(incs), expense = sum(exps);
  const cpCol = collectionProfits(data).col;
  const grossProfit = cols.reduce((a, c) => a + (cpCol[c.id] || 0), 0);
  const otherIncome = sum(incs.filter((i) => i.source !== "tahsilat"));
  const opExpense = sum(exps.filter((e) => e.source !== "iade"));
  const colBank = sum(cols.filter((c) => !!c.bankAccountId));
  const colCash = sum(cols.filter((c) => !c.bankAccountId));
  return {
    salesCount: sales.length, sales: sales.reduce((a, s) => a + docTotal(s), 0), returns: rets.reduce((a, r) => a + docTotal(r), 0),
    incomeCount: incs.length, income, incBank: sum(incs.filter((i) => !!i.bankAccountId)), incCash: sum(incs.filter((i) => !i.bankAccountId)),
    expenseCount: exps.length, expense, grossProfit, profit: grossProfit + otherIncome - opExpense,
    colCash, colBank, colTotal: colCash + colBank,
    bankIn: sum(tx.filter((t) => t.type === "giris")), bankOut: sum(tx.filter((t) => t.type === "cikis")),
  };
}
const summarizeDay = summarizePeriod;

const REPORT_COLS = {
  all: [["salesCount", "Satış adedi", 1], ["sales", "Satış"], ["returns", "İade (gidere dahil)"], ["income", "Gelir"], ["incCash", "Gelir · nakit"], ["incBank", "Gelir · banka"], ["expense", "Gider"], ["grossProfit", "Satış kârı"], ["profit", "Net kâr"]],
  tahsilat: [["colCash", "Tahsilat · nakit"], ["colBank", "Tahsilat · banka"], ["colTotal", "Toplam tahsilat"], ["bankIn", "Bankaya giren"], ["bankOut", "Bankadan çıkan"]],
  satis: [["salesCount", "Satış adedi", 1], ["sales", "Satış tutarı"], ["returns", "İade"], ["colTotal", "Tahsilat"], ["grossProfit", "Satış kârı"]],
  gelir: [["incomeCount", "Kayıt", 1], ["income", "Gelir"], ["incCash", "Nakit"], ["incBank", "Banka"]],
  gider: [["expenseCount", "Kayıt", 1], ["expense", "Gider"]],
};

function periodDetail(data, prefix) {
  const inP = periodFilter(prefix);
  const docTotal = (d) => d.items.reduce((a, it) => a + it.qty * it.price, 0);
  const cpCol = collectionProfits(data).col;
  const cname = (id) => (data.companies.find((c) => c.id === id) || {}).name || "Silinmiş firma";
  const pname = (id) => (data.products.find((p) => p.id === id) || {}).name || "Silinmiş ürün";
  const sales = data.sales.filter(inP), rets = data.returns.filter(inP), incs = incomeRecords(data).filter(inP);
  const exps = data.expenses.filter(inP), cols = data.collections.filter(inP);
  // 1) günlük döküm: hareket olan günler
  const dates = [...new Set([...sales, ...rets, ...incs, ...exps].map((x) => x.date))].sort();
  const days = dates.map((d) => ({ date: d, ...summarizePeriod(data, d) }));
  // 2) kategori kırılımı
  const group = (arr) => {
    const m = {};
    arr.forEach((x) => { const k = x.category || "Diğer"; m[k] = (m[k] || 0) + x.amount; });
    return Object.entries(m).map(([name, amount]) => ({ name, amount })).sort((a, b) => b.amount - a.amount);
  };
  // 3) firma bazında
  const cm = {};
  const ce = (id) => (cm[id] = cm[id] || { id, sales: 0, returns: 0, collected: 0, profit: 0 });
  sales.forEach((s) => { ce(s.companyId).sales += docTotal(s); });
  rets.forEach((r) => { ce(r.companyId).returns += docTotal(r); });
  cols.forEach((c) => { const e = ce(c.companyId); e.collected += c.amount; e.profit += cpCol[c.id] || 0; });
  const byCompany = Object.values(cm).map((e) => ({ ...e, name: cname(e.id) })).sort((a, b) => b.sales - a.sales || b.collected - a.collected);
  // 4) ürün bazında
  const pm = {};
  const pe = (id) => (pm[id] = pm[id] || { id, qty: 0, retQty: 0, revenue: 0, cost: 0 });
  sales.forEach((s) => s.items.forEach((it) => { const e = pe(it.productId); e.qty += it.qty; e.revenue += it.qty * it.price; e.cost += it.qty * itemCost(data, it); }));
  rets.forEach((r) => r.items.forEach((it) => { pe(it.productId).retQty += it.qty; }));
  const byProduct = Object.values(pm).map((e) => ({ ...e, name: pname(e.id) })).sort((a, b) => b.revenue - a.revenue);
  // 5) tüm hareketler
  const moves = [
    ...sales.map((s) => ({ date: s.date, type: "Satış", text: `${s.no} — ${cname(s.companyId)}`, amount: docTotal(s), tone: "" })),
    ...incs.map((i) => ({ date: i.date, type: i.source === "tahsilat" ? "Tahsilat" : "Gelir", text: `${i.description || i.category} · ${i.bankAccountId ? "Banka" : "Nakit"}`, amount: i.amount, tone: "pos" })),
    ...exps.map((e) => ({ date: e.date, type: e.source === "iade" ? "İade" : "Gider", text: e.description || e.category, amount: e.amount, tone: "neg" })),
  ].sort((a, b) => b.date.localeCompare(a.date));
  return { sum: summarizePeriod(data, prefix), days, incByCat: group(incs), expByCat: group(exps), byCompany, byProduct, moves };
}

      </table></div>

      <div style={sec}><table className="table">

        <tbody>{d.moves.map((m, i) => <tr key={i}><td>{fmtDate(m.date)}</td><td><span className="badge badge-neutral">{m.type}</span></td><td>{m.text}</td><td className={"num " + m.tone}>{fmtTRY(m.amount)}</td></tr>)}</tbody>
      </table></div>

function weeksOfMonth(year, m) {
  // Pazartesi-Pazar haftaları; ilk/son hafta ay sınırında kesilir (haftalar toplamı = ay toplamı)
  const last = new Date(year, m + 1, 0).getDate();
  const out = [];
  let start = 1;
  while (start <= last) {
    const dow = (new Date(year, m, start).getDay() + 6) % 7;
    const end = Math.min(last, start + (6 - dow));
    out.push({ label: `${start}–${end} ${MONTHS[m]}`, from: localDateStr(new Date(year, m, start)), to: localDateStr(new Date(year, m, end)) });
    start = end + 1;
  }
  return out;
}

function ReportModal({ data, kind = "all", onClose }) {
  const now = new Date();
  const [mode, setMode] = useState("ay"); // ay | hafta
  const [k, setK] = useState(kind);
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [detail, setDetail] = useState(null); // {title, range}
  const years = useMemo(() => {
    const ys = new Set([now.getFullYear()]);
    [data.sales, data.incomes, data.expenses, data.collections, data.returns].forEach((arr) =>
      (arr || []).forEach((x) => { const y = Number(String(x.date || "").slice(0, 4)); if (y) ys.add(y); })
    );
    return [...ys].sort((a, b) => b - a);
  }, [data]);
  const cols = REPORT_COLS[k];
  const pad2 = (n) => String(n).padStart(2, "0");
  const rows = mode === "ay"
    ? MONTHS.map((name, i) => ({ name, range: `${year}-${pad2(i + 1)}`, title: `${name} ${year}`, ...summarizePeriod(data, `${year}-${pad2(i + 1)}`) }))
    : weeksOfMonth(year, month).map((w) => { const range = { from: w.from, to: w.to }; return { name: w.label, range, title: `${w.label} ${year}`, ...summarizePeriod(data, range) }; });
  const totalRange = mode === "ay" ? `${year}` : `${year}-${pad2(month + 1)}`;
  const totalTitle = mode === "ay" ? `${year} yılı` : `${MONTHS[month]} ${year}`;
  const total = {};
  cols.forEach(([key]) => { total[key] = rows.reduce((a, r) => a + r[key], 0); });
  const show = (isCount, v) => (isCount ? v || "—" : v ? fmtTRY(v) : "—");
  const tone = (key, v) => (key === "profit" || key === "grossProfit" ? (v >= 0 ? "pos" : "neg") : key === "income" || key === "colTotal" ? "pos" : key === "expense" || key === "returns" ? "neg" : "");
  if (detail) {
    return (
      <Modal title={`Rapor — ${detail.title}`} onClose={onClose} wide>
        <button className="link-btn" style={{ marginBottom: 12 }} onClick={() => setDetail(null)}>← Rapor listesine dön</button>
        <ReportDetail data={data} range={detail.range} />
      </Modal>
    );
  }
  return (
    <Modal title="Rapor" onClose={onClose} wide>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 14 }}>
        <div className="seg">
          <button type="button" className={mode === "ay" ? "on" : ""} onClick={() => setMode("ay")}>Aylık</button>
          <button type="button" className={mode === "hafta" ? "on" : ""} onClick={() => setMode("hafta")}>Haftalık</button>
        </div>
        <select className="year-select" value={year} onChange={(e) => setYear(Number(e.target.value))}>
          {years.map((y) => <option key={y} value={y}>{y}</option>)}
        </select>
        {mode === "hafta" && (
          <select className="year-select" value={month} onChange={(e) => setMonth(Number(e.target.value))}>
            {MONTHS.map((n, i) => <option key={n} value={i}>{n}</option>)}
          </select>
        )}
        {kind === "all" && (
          <div className="seg">
            <button type="button" className={k === "all" ? "on" : ""} onClick={() => setK("all")}>Genel</button>
            <button type="button" className={k === "tahsilat" ? "on" : ""} onClick={() => setK("tahsilat")}>Tahsilat &amp; banka</button>
          </div>
        )}
      </div>
      <p className="muted small" style={{ margin: "-4px 0 10px" }}>Ayrıntılı rapor için bir satıra tıklayın.</p>
      <div style={{ overflowX: "auto" }}>
        <table className="table">
          <thead><tr><th>{mode === "ay" ? "Ay" : "Hafta"}</th>{cols.map(([key, label]) => <th key={key} className="num">{label}</th>)}</tr></thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.name} className="row-click" onClick={() => setDetail({ title: r.title, range: r.range })}>
                <td>{r.name}</td>
                {cols.map(([key, , isCount]) => <td key={key} className={"num " + tone(key, r[key])}>{show(isCount, r[key])}</td>)}
              </tr>
            ))}
            <tr className="month-total row-click" onClick={() => setDetail({ title: totalTitle, range: totalRange })}>
              <td>{mode === "ay" ? `${year} toplam` : `${MONTHS[month]} toplam`}</td>
              {cols.map(([key, , isCount]) => <td key={key} className={"num " + tone(key, total[key])}>{show(isCount, total[key])}</td>)}
            </tr>
          </tbody>
        </table>
      </div>
    </Modal>
  );
}

                    <td className={"num " + (bankBalance(a.id) >= 0 ? "" : "neg")}>{fmtTRY(bankBalance(a.id))}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </>
        )}
      </section>

      <div className="stat-grid">
        <StatCard label="Toplam Gelir" value={fmtTRY(totals.income)} icon={ArrowUpRight} tone="pos" />
        <StatCard label="Toplam Gider" value={fmtTRY(totals.expense)} icon={ArrowDownRight} tone="neg" />
        <StatCard label="Toplam satış kârı" value={fmtTRY(totals.grossProfit)} icon={TrendingUp} tone={totals.grossProfit >= 0 ? "pos" : "neg"} />
        <StatCard label="Net kâr" value={fmtTRY(totals.net)} icon={CircleDollarSign} tone={totals.net >= 0 ? "pos" : "neg"} />
        <StatCard label="Banka Bakiyesi" value={fmtTRY(totals.bank)} icon={Landmark} tone="neutral" />
        <StatCard label="Toplam Satış Adedi" value={totals.salesCount} icon={ShoppingCart} tone="neutral" />
      </div>

      <section className="card">
        <div className="card-head"><h2>Günlük özet (son 7 gün)</h2></div>
        <table className="table">
          <thead><tr><th>Tarih</th><th className="num">Gelir</th><th className="num">Gider</th><th className="num">Satış kârı</th><th className="num">Net kâr</th><th className="num">Tahsilat (nakit)</th><th className="num">Tahsilat (banka)</th></tr></thead>
          <tbody>
            {last7.map((row) => (
              <tr key={row.date}>
                <td>{fmtDate(row.date)}{row.date === today ? " · bugün" : ""}</td>
                <td className="num pos">{fmtTRY(row.income)}</td>
                <td className="num neg">{fmtTRY(row.expense)}</td>
                <td className={"num " + (row.grossProfit >= 0 ? "pos" : "neg")}>{fmtTRY(row.grossProfit)}</td>
                <td className={"num " + (row.profit >= 0 ? "pos" : "neg")}>{fmtTRY(row.profit)}</td>
                <td className="num">{fmtTRY(row.colCash)}</td>
                <td className="num">{fmtTRY(row.colBank)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </section>

      <div className="two-col">
        <section className="card">
          <div className="card-head">
            <h2>Son satışlar</h2>
            <button className="link-btn" onClick={() => setTab("satis")}>Tümünü gör</button>
          </div>
          {recentSales.length === 0 ? (
            <Empty icon={ShoppingCart} title="Henüz satış yok" hint="Satış sekmesinden ilk faturanızı oluşturun." />
          ) : (
            <table className="table">
              <thead><tr><th>No</th><th>Tarih</th><th>Firma</th><th className="num">Tutar</th></tr></thead>
              <tbody>
                {recentSales.map((s) => {
                  const c = data.companies.find((x) => x.id === s.companyId);
                  const total = s.items.reduce((a, it) => a + it.qty * it.price, 0);
                  return (
                    <tr key={s.id}>
                      <td>{s.no}</td>
                      <td>{fmtDate(s.date)}</td>
                      <td>{c ? c.name : "—"}</td>
                      <td className="num">{fmtTRY(total)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </section>

        <section className="card">
          <div className="card-head">
            <h2>Kritik stok</h2>
            <button className="link-btn" onClick={() => setTab("urunler")}>Ürünlere git</button>
          </div>
          {totals.lowStock.length === 0 ? (
            <Empty icon={Package} title="Kritik seviyede ürün yok" hint="Tüm stoklar minimum seviyenin üzerinde." />
          ) : (
            <table className="table">
              <thead><tr><th>Ürün</th><th className="num">Stok</th><th className="num">Min.</th></tr></thead>
              <tbody>
                {totals.lowStock.map((p) => (
                  <tr key={p.id}>
                    <td>{p.name}</td>
                    <td className="num warn-text">{stockOf(p.id)} {p.unit}</td>
                    <td className="num">{p.minStock}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </section>
      </div>
    </div>
  );
}

/* ================= ÜRÜNLER ================= */

function Urunler({ data, update, stockOf }) {
  const [modal, setModal] = useState(null); // {mode:'new'|'edit', product}
  const [q, setQ] = useState("");

  const filtered = data.products.filter((p) => (p.name + p.code).toLowerCase().includes(q.toLowerCase()));

  function save(form) {
    if (modal.mode === "new") {
      update("products", (arr) => [...arr, { ...form, id: uid(), openingStock: 0 }]);
    } else {
      update("products", (arr) => arr.map((p) => (p.id === modal.product.id ? { ...p, ...form } : p)));
    }
    setModal(null);
  }
  function remove(id) {
    update("products", (arr) => arr.filter((p) => p.id !== id));
    update("stockMovements", (arr) => arr.filter((m) => m.productId !== id));
  }

  return (
    <div className="page">
      <header className="page-head">
        <div><h1>Ürünler</h1><p className="muted">Ürün kataloğu ve fiyatlar — stok takibi için Stok sekmesini kullanın</p></div>
        <button className="btn btn-primary" onClick={() => setModal({ mode: "new" })}><Plus size={16} /> Yeni ürün</button>
      </header>

      <div className="toolbar">
        <div className="search"><Search size={15} /><input placeholder="Ürün adı veya kodu ara" value={q} onChange={(e) => setQ(e.target.value)} /></div>
      </div>

      {filtered.length === 0 ? (
        <Empty icon={Package} title="Ürün bulunamadı" hint="Yeni ürün ekleyerek başlayın." />
      ) : (
        <div className="card">
          <table className="table">
            <thead>
              <tr>
                <th>Kod</th><th>Ürün adı</th><th>Birim</th>
                <th className="num">Alış</th><th className="num">Satış</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((p) => (
                <tr key={p.id}>
                  <td className="mono">{p.code}</td>
                  <td>{p.name}</td>
                  <td>{p.unit}</td>
                  <td className="num">{fmtTRY(p.purchasePrice)}</td>
                  <td className="num">{fmtTRY(p.salePrice)}</td>
                  <td className="row-actions">
                    <button className="icon-btn" title="Düzenle" onClick={() => setModal({ mode: "edit", product: p })}><Pencil size={15} /></button>
                    <DangerButton onConfirm={() => remove(p.id)} label="" confirmLabel="Sil?" />
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {modal && (
        <ProductForm mode={modal.mode} initial={modal.product} onCancel={() => setModal(null)} onSave={save} />
      )}
    </div>
  );
}

function ProductForm({ mode, initial, onCancel, onSave }) {
  const [f, setF] = useState(
    initial || { code: "", name: "", unit: "Adet", purchasePrice: 0, salePrice: 0, minStock: 5 }
  );
  const set = (k) => (e) => setF({ ...f, [k]: e.target.type === "number" ? Number(e.target.value) : e.target.value });
  return (
    <Modal title={mode === "new" ? "Yeni ürün" : "Ürünü düzenle"} onClose={onCancel}>
      <div className="form-grid">
        <Field label="Ürün kodu"><input value={f.code} onChange={set("code")} placeholder="URN-004" /></Field>
        <Field label="Ürün adı"><input value={f.name} onChange={set("name")} placeholder="Örn. A4 Kağıt" /></Field>
        <Field label="Birim">
          <select value={f.unit} onChange={set("unit")}>{UNITS.map((u) => <option key={u}>{u}</option>)}</select>
        </Field>
        <Field label="Alış fiyatı (₺)"><input type="number" min="0" value={f.purchasePrice} onChange={set("purchasePrice")} /></Field>
        <Field label="Satış fiyatı (₺)"><input type="number" min="0" value={f.salePrice} onChange={set("salePrice")} /></Field>
        <Field label="Minimum stok uyarısı"><input type="number" min="0" value={f.minStock} onChange={set("minStock")} /></Field>
      </div>
      <p className="hint-banner">Stok miktarı burada girilmez — ürünü kaydettikten sonra stok girişini "Stok" sekmesinden yapın.</p>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button className="btn btn-primary" disabled={!f.name || !f.code} onClick={() => onSave(f)}>Kaydet</button>
      </div>
    </Modal>
  );
}

function StockEntryModal({ product, onCancel, onSave }) {
  const [qty, setQty] = useState(1);
  const [type, setType] = useState("giris");
  return (
    <Modal title={`Stok hareketi — ${product.name}`} onClose={onCancel}>

        <Field label="Hareket türü">
          <select value={type} onChange={(e) => setType(e.target.value)}>
            <option value="giris">Stok girişi (+)</option>
            <option value="sayim">Sayım düzeltmesi (+)</option>
          </select>
        </Field>
        <Field label={`Miktar (${product.unit})`}><input type="number" min="1" value={qty} onChange={(e) => setQty(e.target.value)} /></Field>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button className="btn btn-primary" onClick={() => onSave(qty, type)}>Kaydet</button>
      </div>

}

/* ================= STOK ================= */

function Stok({ data, update, stockOf }) {
  const [stockModal, setStockModal] = useState(null); // product for stock entry
  const [expanded, setExpanded] = useState(null);
  const [q, setQ] = useState("");

  const filtered = data.products.filter((p) => (p.name + p.code).toLowerCase().includes(q.toLowerCase()));

  function addStockMovement(qty, type) {
    update("stockMovements", (arr) => [...arr, { id: uid(), productId: stockModal.id, type, qty: Number(qty), date: todayStr() }]);
    setStockModal(null);
  }
  function deleteMovement(id) {
    update("stockMovements", (arr) => arr.filter((m) => m.id !== id));
  }

  const lowCount = data.products.filter((p) => stockOf(p.id) <= p.minStock).length;

  return (
    <div className="page">
      <header className="page-head">
        <div><h1>Stok</h1><p className="muted">Güncel stok seviyeleri ve stok hareketleri</p></div>
      </header>

      {lowCount > 0 && (
        <p className="hint-banner warn"><AlertTriangle size={13} style={{ verticalAlign: "-2px", marginRight: 4 }} />{lowCount} üründe stok kritik seviyede veya altında.</p>
      )}

      <div className="toolbar">
        <div className="search"><Search size={15} /><input placeholder="Ürün adı veya kodu ara" value={q} onChange={(e) => setQ(e.target.value)} /></div>
      </div>

      {filtered.length === 0 ? (
        <Empty icon={Boxes} title="Ürün bulunamadı" hint="Önce Ürünler sekmesinden ürün ekleyin." />
      ) : (
        <div className="card">
          {filtered.map((p) => {
            const stock = stockOf(p.id);
            const low = stock <= p.minStock;
            const open = expanded === p.id;
            const movements = data.stockMovements.filter((m) => m.productId === p.id).sort((a, b) => b.date.localeCompare(a.date));
            return (
              <div className="company-row" key={p.id}>
                <div className="company-summary" onClick={() => setExpanded(open ? null : p.id)}>
                  <div className="company-chevron">{open ? <ChevronDown size={16} /> : <ChevronRight size={16} />}</div>
                  <div className="company-name">
                    <div>{p.name}</div>
                    <div className="muted small mono">{p.code}</div>
                  </div>
                  <div className={"num balance-tag " + (low ? "warn-text" : "pos")}>
                    {stock} {p.unit} {low && <AlertTriangle size={12} />}
                  </div>
                  <div className="row-actions" onClick={(e) => e.stopPropagation()}>
                    <button className="btn btn-ghost" onClick={() => setStockModal(p)}><Plus size={14} /> Stok girişi</button>
                  </div>
                </div>
                {open && (
                  <div className="company-detail">
                    <h4>Stok hareketleri</h4>
                    {movements.length === 0 ? (
                      <p className="muted small">Henüz hareket yok</p>
                    ) : (
                      movements.map((m) => (
                        <div className="mini-row" key={m.id}>
                          <span>
                            {fmtDate(m.date)} ·{" "}
                            {m.type === "satis" ? "Satış (-)" : m.type === "iade" ? "İade (+)" : m.type === "sayim" ? "Sayım (+)" : "Stok girişi (+)"} ·{" "}
                            {m.qty} {p.unit}
                          </span>
                          {(m.type === "giris" || m.type === "sayim") && <DangerButton onConfirm={() => deleteMovement(m.id)} label="" confirmLabel="Sil?" />}
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {stockModal && (
        <StockEntryModal product={stockModal} onCancel={() => setStockModal(null)} onSave={addStockMovement} />
      )}
    </div>
  );
}

function Firmalar({ data, update, companyBalance, addCollection, deleteCollection, updateCollection, bankAccounts }) {
  const [modal, setModal] = useState(null);
  const [editCol, setEditCol] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [collectModal, setCollectModal] = useState(null);
  const [q, setQ] = useState("");

  const filtered = data.companies.filter((c) => c.name.toLowerCase().includes(q.toLowerCase()));

  function save(form) {
    if (modal.mode === "new") update("companies", (arr) => [...arr, { ...form, id: uid() }]);
    else update("companies", (arr) => arr.map((c) => (c.id === modal.company.id ? { ...c, ...form } : c)));
    setModal(null);
  }
  function remove(id) {
    update("companies", (arr) => arr.filter((c) => c.id !== id));
  }

  return (
    <div className="page">
      <header className="page-head">
        <div><h1>Firmalar</h1><p className="muted">Müşteri ve tedarikçi cari hesapları</p></div>
        <button className="btn btn-primary" onClick={() => setModal({ mode: "new" })}><Plus size={16} /> Yeni firma</button>
      </header>

      <div className="toolbar">
        <div className="search"><Search size={15} /><input placeholder="Firma ara" value={q} onChange={(e) => setQ(e.target.value)} /></div>
      </div>

      {filtered.length === 0 ? (
        <Empty icon={Building2} title="Firma bulunamadı" hint="Yeni firma ekleyerek başlayın." />
      ) : (
        <div className="card">
          {filtered.map((c) => {
            const bal = companyBalance(c.id);
            const open = expanded === c.id;
            const cols = data.collections.filter((x) => x.companyId === c.id);
            const sales = data.sales.filter((x) => x.companyId === c.id);
            const returns = data.returns.filter((x) => x.companyId === c.id);
            return (
              <div className="company-row" key={c.id}>
                <div className="company-summary" onClick={() => setExpanded(open ? null : c.id)}>
                  <div className="company-chevron">{open ? <ChevronDown size={16} /> : <ChevronRight size={16} />}</div>
                  <div className="company-name">
                    <div>{c.name}</div>
                    <div className="muted small">{c.type} · {c.taxNo || "VKN yok"}</div>
                  </div>
                  <div className={"num balance-tag " + (bal > 0 ? "warn-text" : bal < 0 ? "pos" : "")}>
                    {bal === 0 ? "Bakiye yok" : (bal > 0 ? "Alacak " : "Borç ") + fmtTRY(Math.abs(bal))}
                  </div>
                  <div className="row-actions" onClick={(e) => e.stopPropagation()}>
                    <button className="icon-btn" title="Tahsilat / Ödeme" onClick={() => setCollectModal(c)}><Banknote size={15} /></button>
                    <button className="icon-btn" title="Düzenle" onClick={() => setModal({ mode: "edit", company: c })}><Pencil size={15} /></button>
                    <DangerButton onConfirm={() => remove(c.id)} label="" confirmLabel="Sil?" />
                  </div>
                </div>
                {open && (
                  <div className="company-detail">
                    <div className="company-detail-grid">
                      <div><span className="muted small">Telefon</span><div>{c.phone || "-"}</div></div>
                      <div><span className="muted small">E-posta</span><div>{c.email || "-"}</div></div>
                      <div><span className="muted small">Adres</span><div>{c.address || "-"}</div></div>
                    </div>
                    <div className="mini-tables">
                      <div>
                        <h4>Satışlar ({sales.length})</h4>
                        {sales.length === 0 ? <p className="muted small">Kayıt yok</p> : sales.map((s) => (
                          <div className="mini-row" key={s.id}><span>{s.no} · {fmtDate(s.date)}</span></div>
                        ))}
                      </div>
                      <div>
                        <h4>İadeler ({returns.length})</h4>
                        {returns.length === 0 ? <p className="muted small">Kayıt yok</p> : returns.map((r) => (
                          <div className="mini-row" key={r.id}><span>{r.no} · {fmtDate(r.date)}</span></div>
                        ))}
                      </div>
                      <div>
                        <h4>Tahsilatlar ({cols.length})</h4>
                        {cols.length === 0 ? <p className="muted small">Kayıt yok</p> : cols.map((x) => (
                          <div className="mini-row" key={x.id}>
                            <span>{fmtDate(x.date)} · {fmtTRY(x.amount)}{x.note ? " · " + x.note : ""}</span>
                            <span className="row-actions"><button className="icon-btn" title="Düzenle" onClick={() => setEditCol(x)}><Pencil size={15} /></button><DangerButton onConfirm={() => deleteCollection(x.id)} label="" confirmLabel="Sil?" /></span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {modal && <CompanyForm mode={modal.mode} initial={modal.company} onCancel={() => setModal(null)} onSave={save} />}
      {collectModal && (
        <CollectionModal
          company={collectModal}
          bankAccounts={bankAccounts}
          onCancel={() => setCollectModal(null)}
          onSave={(form) => { addCollection({ ...form, companyId: collectModal.id }); setCollectModal(null); }}
        />
      )}
      {editCol && (
        <CollectionModal
          company={data.companies.find((c) => c.id === editCol.companyId) || { name: "Firma" }}
          initial={editCol}
          bankAccounts={bankAccounts}
          onCancel={() => setEditCol(null)}
          onSave={(f) => { updateCollection(editCol.id, f); setEditCol(null); }}
        />
      )}
    </div>
  );
}

function CompanyForm({ mode, initial, onCancel, onSave }) {
  const [f, setF] = useState(initial || { name: "", type: "Müşteri", taxNo: "", phone: "", email: "", address: "" });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  return (
    <Modal title={mode === "new" ? "Yeni firma" : "Firmayı düzenle"} onClose={onCancel}>
      <div className="form-grid">
        <Field label="Firma adı"><input value={f.name} onChange={set("name")} /></Field>
        <Field label="Tür"><select value={f.type} onChange={set("type")}>{COMPANY_TYPES.map((t) => <option key={t}>{t}</option>)}</select></Field>
        <Field label="Vergi kimlik no"><input value={f.taxNo} onChange={set("taxNo")} /></Field>
        <Field label="Telefon"><input value={f.phone} onChange={set("phone")} /></Field>
        <Field label="E-posta"><input value={f.email} onChange={set("email")} /></Field>
        <Field label="Adres"><input value={f.address} onChange={set("address")} /></Field>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button className="btn btn-primary" disabled={!f.name} onClick={() => onSave(f)}>Kaydet</button>
      </div>
    </Modal>
  );
}

function CollectionModal({ company, sale, saleTotalAmount, alreadyCollected, bankAccounts, initial, onCancel, onSave }) {
  const remaining = sale ? Math.max(saleTotalAmount - alreadyCollected, 0) : 0;
  const [f, setF] = useState(initial
    ? { date: initial.date, amount: initial.amount, bankAccountId: initial.bankAccountId || "", note: initial.note || "" }
    : { date: todayStr(), amount: sale ? remaining : 0, bankAccountId: bankAccounts[0]?.id || "", note: "" });
  return (
    <Modal title={initial ? `Tahsilatı düzenle — ${company.name}` : sale ? `Tahsilat — ${company.name} (${sale.no})` : `Tahsilat — ${company.name}`} onClose={onCancel}>
      {sale && (
        <p className="hint-banner">
          Bu satışın toplamı {fmtTRY(saleTotalAmount)}, şu ana kadar {fmtTRY(alreadyCollected)} tahsil edildi. Kalan: <strong>{fmtTRY(remaining)}</strong>
        </p>
      )}
      <div className="form-grid">
        <Field label="Tarih"><input type="date" value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></Field>
        <Field label="Tutar (₺)"><input type="number" min="0" value={f.amount} onChange={(e) => setF({ ...f, amount: Number(e.target.value) })} /></Field>
        <Field label="Sebep / Açıklama (opsiyonel)"><input value={f.note} onChange={(e) => setF({ ...f, note: e.target.value })} placeholder="Örn. Nakit ödeme, banka havalesi..." /></Field>
        <Field label="Nereye alındı">
          <select value={f.bankAccountId} onChange={(e) => setF({ ...f, bankAccountId: e.target.value })}>
            <option value="">Nakit (kasa)</option>
            {bankAccounts.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
          </select>
        </Field>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button className="btn btn-primary" disabled={!f.amount} onClick={() => onSave(f)}>Kaydet</button>
      </div>
    </Modal>
  );
}

/* ================= SATIŞ ================= */
