            <thead><tr><th>No</th><th>Tarih</th><th>Firma</th><th>Durum</th><th className="num">Tutar</th><th className="num">Kâr (gerçekleşen / toplam)</th><th></th></tr></thead>
            <tbody>
              {sorted.map((s) => {
                const c = data.companies.find((x) => x.id === s.companyId);
                const total = saleTotal(s);
                const collected = collectedFor(s.id);
                const remaining = total - collected;
                const status = remaining <= 0.005 ? "Ödendi" : collected > 0 ? "Kısmi ödeme" : "Açık hesap";
                const badgeClass = status === "Ödendi" ? "badge-pos" : status === "Kısmi ödeme" ? "badge-neutral" : "badge-warn";
                return (
                  <tr key={s.id}>
                    <td className="mono">{s.no}</td>
                    <td>{fmtDate(s.date)}</td>
                    <td>{c ? c.name : "Silinmiş firma"}</td>
                    <td><span className={"badge " + badgeClass}>{status}</span></td>
                    <td className="num">{fmtTRY(total)}</td>
                    <td className="num">{fmtTRY(cp.sale[s.id] || 0)} <span className="muted small">/ {fmtTRY(cp.pot[s.id] || 0)}</span></td>
                    <td className="row-actions">
                      {remaining > 0.005 && (
                        <button className="icon-btn" title="Tahsilat al" onClick={() => setCollectSale(s)}><Banknote size={15} /></button>
                      )}
                      <button className="icon-btn" title="Düzenle" onClick={() => setEditSale(s)}><Pencil size={15} /></button>
                      <DangerButton onConfirm={() => deleteSale(s.id)} confirmLabel="Sil?" />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {modal && (
        <SaleForm data={data} stockOf={stockOf} onCancel={() => setModal(false)} onSave={(s) => { addSale(s); setModal(false); }} />
      )}
      {editSale && (
        <SaleForm data={data} stockOf={stockOf} initial={editSale} onCancel={() => setEditSale(null)} onSave={(s) => { updateSale(editSale.id, s); setEditSale(null); }} />
      )}
      {collectSale && (
        <CollectionModal
          company={data.companies.find((c) => c.id === collectSale.companyId) || { name: "Firma" }}
          sale={collectSale}
          saleTotalAmount={saleTotal(collectSale)}
          alreadyCollected={collectedFor(collectSale.id)}
          bankAccounts={data.bankAccounts}
          onCancel={() => setCollectSale(null)}
          onSave={(form) => { addCollection({ ...form, companyId: collectSale.companyId, saleId: collectSale.id }); setCollectSale(null); }}
        />
      )}
    </div>
  );
}

function SaleForm({ data, stockOf, initial, onCancel, onSave }) {
  const [companyId, setCompanyId] = useState(initial ? initial.companyId : data.companies[0]?.id || "");
  const [date, setDate] = useState(initial ? initial.date : todayStr());
  const newItem = () => ({ productId: data.products[0]?.id || "", qty: 1, price: data.products[0]?.salePrice || 0, cost: data.products[0]?.purchasePrice || 0 });
  const [items, setItems] = useState(initial ? initial.items.map((it) => ({ ...it })) : [newItem()]);
  // düzenlerken bu satışın kendi düştüğü stok geri sayılır
  const availStock = (pid) => stockOf(pid) + (initial ? initial.items.filter((x) => x.productId === pid).reduce((a, x) => a + x.qty, 0) : 0);

  const addItem = () => setItems([...items, newItem()]);
  const removeItem = (i) => setItems(items.filter((_, idx) => idx !== i));
  const updateItem = (i, patch) => setItems(items.map((it, idx) => (idx === i ? { ...it, ...patch } : it)));
  const onProductChange = (i, pid) => {
    const p = data.products.find((x) => x.id === pid);
    updateItem(i, { productId: pid, price: p?.salePrice || 0, cost: p?.purchasePrice || 0 });
  };

  const total = items.reduce((a, it) => a + it.qty * it.price, 0);
  const stockErrors = items.filter((it) => it.qty > availStock(it.productId));

  function handleSave() {
    onSave({
      id: initial ? initial.id : uid(),
      no: initial ? initial.no : "SAT-" + Date.now().toString().slice(-6),
      date, companyId,
      items,
    });
  }

  return (
    <Modal title={initial ? `Satışı düzenle — ${initial.no}` : "Yeni satış"} onClose={onCancel} wide>
      <div className="form-grid">
        <Field label="Firma">
          <select value={companyId} onChange={(e) => setCompanyId(e.target.value)}>
            {data.companies.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </Field>
        <Field label="Tarih"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      </div>

      <h4 className="section-title">Kalemler</h4>
      <div className="line-items">
        {items.map((it, i) => (
          <div className="line-item" key={i}>
            <select value={it.productId} onChange={(e) => onProductChange(i, e.target.value)}>
              {data.products.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
            <input type="number" min="1" value={it.qty} onChange={(e) => updateItem(i, { qty: Number(e.target.value) })} />
            <input type="number" min="0" value={it.price} onChange={(e) => updateItem(i, { price: Number(e.target.value) })} />
            <span className="num line-total">{fmtTRY(it.qty * it.price)}</span>
            <button className="icon-btn" onClick={() => removeItem(i)} disabled={items.length === 1}><Trash2 size={14} /></button>
          </div>
        ))}
        <button className="link-btn" onClick={addItem}><Plus size={14} /> Kalem ekle</button>
      </div>

      {stockErrors.length > 0 && (
        <p className="hint-banner warn">Bazı ürünlerde yeterli stok yok, yine de kaydedebilirsiniz ancak stok negatife düşecek.</p>
      )}

      {initial && data.returns.some((r) => r.saleId === initial.id) && <p className="hint-banner warn">Bu satışa bağlı iade kaydı var. Kalemleri değiştirirseniz iade kayıtlarını da kontrol edin.</p>}
      <p className="hint-banner">Satış açık hesap olarak kaydedilir. Ödeme geldiğinde satış listesindeki <Banknote size={12} style={{ verticalAlign: "-2px" }} /> tuşuyla tahsilat girebilirsiniz.</p>

      <div className="grand-total">Genel toplam <strong>{fmtTRY(total)}</strong></div>

      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button className="btn btn-primary" disabled={!companyId} onClick={handleSave}>{initial ? "Değişiklikleri kaydet" : "Satışı kaydet"}</button>
      </div>
    </Modal>
  );
}

function Iade({ data, addReturn, updateReturn, deleteReturn, saleTotal, returnTotal }) {
  const [modal, setModal] = useState(false);
  const [editRet, setEditRet] = useState(null);

      </header>

      {data.sales.length === 0 && <p className="hint-banner">İade oluşturmak için önce bir satış kaydı olmalı.</p>}

      {sorted.length === 0 ? (
        <Empty icon={Undo2} title="Henüz iade yok" hint="Bir satışa bağlı iade oluşturabilirsiniz." />
      ) : (
        <div className="card">
          <table className="table">
            <thead><tr><th>No</th><th>Tarih</th><th>Firma</th><th>İlgili satış</th><th className="num">Tutar</th><th></th></tr></thead>
            <tbody>
              {sorted.map((r) => {
                const c = data.companies.find((x) => x.id === r.companyId);
                const s = data.sales.find((x) => x.id === r.saleId);
                return (
                  <tr key={r.id}>
                    <td className="mono">{r.no}</td>
                    <td>{fmtDate(r.date)}</td>
                    <td>{c ? c.name : "-"}</td>
                    <td>{s ? s.no : "Manuel"}</td>
                    <td className="num">{fmtTRY(returnTotal(r))}</td>
                    <td className="row-actions"><button className="icon-btn" title="Düzenle" onClick={() => setEditRet(r)}><Pencil size={15} /></button><DangerButton onConfirm={() => deleteReturn(r.id)} confirmLabel="Sil?" /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {modal && <ReturnForm data={data} saleTotal={saleTotal} onCancel={() => setModal(false)} onSave={(r) => { addReturn(r); setModal(false); }} />}
      {editRet && <ReturnForm data={data} initial={editRet} onCancel={() => setEditRet(null)} onSave={(r) => { updateReturn(editRet.id, r); setEditRet(null); }} />}
    </div>
  );
}

function ReturnForm({ data, initial, onCancel, onSave }) {
  const [saleId, setSaleId] = useState(initial ? initial.saleId : data.sales[0]?.id || "");
  const sale = data.sales.find((s) => s.id === saleId);
  const [date, setDate] = useState(initial ? initial.date : todayStr());
  const [refund, setRefund] = useState(initial ? !!initial.bankAccountId : false);
  const [bankAccountId, setBankAccountId] = useState((initial && initial.bankAccountId) || data.bankAccounts[0]?.id || "");
  const [qtys, setQtys] = useState({});

  useEffect(() => {
    if (sale) {
      const init = {};
      if (initial && initial.saleId === saleId) {
        // kayıtlı iade kalemlerini satış kalemleriyle (ürün + fiyat) eşleştir
        const pool = initial.items.map((x) => ({ ...x }));
        sale.items.forEach((it, idx) => {
          const m = pool.find((x) => !x.used && x.productId === it.productId && x.price === it.price);
          if (m) { m.used = true; init[idx] = m.qty; } else init[idx] = 0;
        });
      } else sale.items.forEach((it, idx) => (init[idx] = 0));
      setQtys(init);
    }
  }, [saleId]);

  if (!sale) return null;

  const items = sale.items
    .map((it, idx) => ({ ...it, qty: Number(qtys[idx] || 0) }))
    .filter((it) => it.qty > 0);
  const total = items.reduce((a, it) => a + it.qty * it.price, 0);

  return (
    <Modal title={initial ? `İadeyi düzenle — ${initial.no}` : "Yeni iade"} onClose={onCancel} wide>
      <div className="form-grid">
        <Field label="İlgili satış">
          <select value={saleId} disabled={!!initial} onChange={(e) => setSaleId(e.target.value)}>
            {data.sales.map((s) => <option key={s.id} value={s.id}>{s.no} — {fmtDate(s.date)}</option>)}
          </select>
        </Field>
        <Field label="Tarih"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
        <Field label="Para iadesi yapılsın mı?">
          <select value={refund ? "yes" : "no"} onChange={(e) => setRefund(e.target.value === "yes")}>
            <option value="no">Hayır, sadece cari mahsup</option>
            <option value="yes">Evet, bankadan iade edilecek</option>
          </select>
        </Field>
        {refund && (
          <Field label="İade hesabı">
            <select value={bankAccountId} onChange={(e) => setBankAccountId(e.target.value)}>
              {data.bankAccounts.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
            </select>
          </Field>
        )}
      </div>

      <h4 className="section-title">İade edilecek kalemler</h4>
      <div className="line-items">
        {sale.items.map((it, idx) => {
          const p = data.products.find((x) => x.id === it.productId);
          return (
            <div className="line-item return-item" key={idx}>
              <span>{p ? p.name : "Silinmiş ürün"}</span>
              <span className="muted small">Satılan: {it.qty}</span>
              <input type="number" min="0" max={it.qty} value={qtys[idx] || 0} onChange={(e) => setQtys({ ...qtys, [idx]: e.target.value })} />
              <span className="num">{fmtTRY((Number(qtys[idx]) || 0) * it.price)}</span>
            </div>
          );
        })}
      </div>

      <div className="grand-total">İade toplamı <strong>{fmtTRY(total)}</strong></div>

      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button
          className="btn btn-primary"
          disabled={items.length === 0}
          onClick={() =>
            onSave({
              id: initial ? initial.id : uid(),
              no: initial ? initial.no : "IAD-" + Date.now().toString().slice(-6),
              date, saleId, companyId: sale.companyId,
              bankAccountId: refund ? bankAccountId : null,
              items,
            })
          }
        >
          {initial ? "Değişiklikleri kaydet" : "İadeyi kaydet"}
        </button>
      </div>
    </Modal>
  );
}

function Gelir({ data, addManualIncome, deleteIncome, deleteCollection, updateManualIncome, updateCollection, addCollection, bankBalance, categories, addCategory, removeCategory, renameCategory }) {
  const [modal, setModal] = useState(false);
  const [editRec, setEditRec] = useState(null);

  const [dateTo, setDateTo] = useState("");
  const [companySearch, setCompanySearch] = useState("");
  const [collectCompany, setCollectCompany] = useState(null);

  const sorted = [...incomeRecords(data)].sort((a, b) => b.date.localeCompare(a.date));
  const filtered = sorted.filter((i) => (!dateFrom || i.date >= dateFrom) && (!dateTo || i.date <= dateTo));
  const filtering = !!(dateFrom || dateTo);
  const total = filtered.reduce((a, i) => a + i.amount, 0);
  const companyName = (id) => data.companies.find((c) => c.id === id)?.name || "-";
  const bankName = (id) => data.bankAccounts.find((b) => b.id === id)?.name || "Banka";
  const bankTotal = data.bankAccounts.reduce((a, acc) => a + bankBalance(acc.id), 0);
  const todayBankIn = summarizeDay(data, todayStr()).bankIn;

  const companyMatches = companySearch.trim()
    ? data.companies.filter((c) => c.name.toLowerCase().includes(companySearch.trim().toLowerCase()))

  return (
    <div className="page">
      <header className="page-head">

          <ReportButton data={data} kind="gelir" />

        </div>
      </header>

      <section className="card">
        <div className="card-head"><h2>Firmadan tahsilat al</h2></div>
        <p className="muted small" style={{ marginBottom: 10 }}>

        </p>
        <div className="search" style={{ maxWidth: 360 }}>
          <Search size={15} />
          <input placeholder="Firma adı yazın..." value={companySearch} onChange={(e) => setCompanySearch(e.target.value)} />
        </div>
        {companySearch.trim() && (
          companyMatches.length === 0 ? (
            <p className="muted small" style={{ marginTop: 10 }}>Eşleşen firma bulunamadı.</p>
          ) : (
            <div className="company-match-list">
              {companyMatches.map((c) => (
                <button key={c.id} className="company-match-row" onClick={() => { setCollectCompany(c); setCompanySearch(""); }}>
                  <span>{c.name}</span>
                  <span className="muted small">Tahsilat gir →</span>
                </button>
              ))}
            </div>
          )
        )}
      </section>

      <div className="stat-grid">
        <StatCard label={filtering ? "Seçili aralıkta gelir" : "Toplam gelir"} value={fmtTRY(total)} icon={TrendingUp} tone="pos" />
        <StatCard label="Banka bakiyesi" value={fmtTRY(bankTotal)} icon={Landmark} tone="neutral" />
        <StatCard label="Bugün bankaya giren" value={fmtTRY(todayBankIn)} icon={ArrowUpRight} tone="pos" />
      </div>

      <CategoryManager
        title="Gelir kategorileri"
        categories={categories}
        defaults={INCOME_CATEGORIES}
        onAdd={addCategory}
        onRemove={removeCategory}
        onRename={renameCategory}
      />

      <div className="toolbar date-filter">
        <Field label="Başlangıç tarihi"><input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} /></Field>
        <Field label="Bitiş tarihi"><input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)} /></Field>
        {filtering && <button className="btn btn-ghost" onClick={() => { setDateFrom(""); setDateTo(""); }}>Filtreyi temizle</button>}

      {filtered.length === 0 ? (
        <Empty icon={TrendingUp} title={filtering ? "Bu tarih aralığında gelir yok" : "Henüz gelir kaydı yok"} />
      ) : (
        <div className="card">
          <table className="table">
            <thead><tr><th>Tarih</th><th>Açıklama</th><th>Firma</th><th>Kategori</th><th>Kaynak</th><th>Ödeme</th><th className="num">Tutar</th><th></th></tr></thead>
            <tbody>

                  <td className="row-actions"><button className="icon-btn" title="Düzenle" onClick={() => setEditRec(i)}><Pencil size={15} /></button><DangerButton onConfirm={() => (i.source === "tahsilat" ? deleteCollection(i.id) : deleteIncome(i.id))} confirmLabel="Sil?" /></td>

              ))}
            </tbody>
          </table>
        </div>
      )}

      {modal && <IncomeExpenseForm title="Gelir ekle" categories={categories} bankAccounts={data.bankAccounts} bankBalance={bankBalance} onCancel={() => setModal(false)} onSave={(f) => { addManualIncome(f); setModal(false); }} />}

          onSave={(f) => { updateCollection(editRec.id, f); setEditRec(null); }}
        />
      )}
      {collectCompany && (
        <CollectionModal
          company={collectCompany}
          bankAccounts={data.bankAccounts}
          onCancel={() => setCollectCompany(null)}
          onSave={(form) => { addCollection({ ...form, companyId: collectCompany.id }); setCollectCompany(null); }}
        />
      )}
    </div>
  );

function CategoryManager({ title, categories, defaults, onAdd, onRemove, onRename }) {
  const [value, setValue] = useState("");
  const [editing, setEditing] = useState(null); // category name currently being edited
  const [editValue, setEditValue] = useState("");

  function submit() {
    if (!value.trim()) return;
    onAdd(value);
    setValue("");
  }
  function startEdit(c) {
    setEditing(c);
    setEditValue(c);
  }
  function saveEdit() {
    if (editValue.trim() && editValue.trim() !== editing) onRename(editing, editValue.trim());
    setEditing(null);
  }
  return (
    <div className="card category-card">
      <h4>{title}</h4>
      <div className="category-chips">
        {categories.map((c) =>
          editing === c ? (
            <span className="category-chip category-chip-editing" key={c}>
              <input
                autoFocus
                value={editValue}
                onChange={(ev) => setEditValue(ev.target.value)}
                onKeyDown={(ev) => {
                  if (ev.key === "Enter") saveEdit();
                  if (ev.key === "Escape") setEditing(null);
                }}
              />
              <button className="category-chip-x category-chip-ok" onClick={saveEdit} aria-label="Kaydet"><Check size={12} /></button>
              <button className="category-chip-x" onClick={() => setEditing(null)} aria-label="Vazgeç"><X size={12} /></button>
            </span>
          ) : (
            <span className="category-chip" key={c}>
              {c}
              <button className="category-chip-x" onClick={() => startEdit(c)} aria-label={`${c} kategorisini düzenle`}>
                <Pencil size={11} />
              </button>
              {!defaults.includes(c) && (
                <button className="category-chip-x" onClick={() => onRemove(c)} aria-label={`${c} kategorisini sil`}>
                  <X size={12} />
                </button>
              )}
            </span>
          )
        )}
      </div>
      <div className="category-add">
        <Tag size={14} className="muted" />
        <input
          placeholder="Yeni kategori adı yazıp ekleyin"
          value={value}
          onChange={(e) => setValue(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
        />
        <button className="btn btn-ghost" onClick={submit} disabled={!value.trim()}><Plus size={14} /> Ekle</button>
      </div>
    </div>
  );
}

function IncomeExpenseForm({ title, categories, bankAccounts, bankBalance, initial, onCancel, onSave }) {
  const [f, setF] = useState(initial
    ? { date: initial.date, description: initial.description || "", category: initial.category || categories[0] || "", amount: initial.amount, bankAccountId: initial.bankAccountId || "" }
    : { date: todayStr(), description: "", category: categories[0] || "", amount: 0, bankAccountId: "" });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.type === "number" ? Number(e.target.value) : e.target.value });
  const withBankUI = typeof bankBalance === "function"; // sadece Gelir formunda açık
  const isBank = !!f.bankAccountId;
  // düzeltirken bakiyeden bu kaydın kendi tutarı düşülür (çifte sayılmasın)
  const current = isBank ? bankBalance(f.bankAccountId) - (initial && initial.bankAccountId === f.bankAccountId ? Number(initial.amount) || 0 : 0) : 0;
  const after = current + (Number(f.amount) || 0);
  return (
    <Modal title={title} onClose={onCancel}>
      <div className="form-grid">
        <Field label="Tarih"><input type="date" value={f.date} onChange={set("date")} /></Field>
        <Field label="Kategori"><select value={f.category} onChange={set("category")}>{categories.map((c) => <option key={c}>{c}</option>)}</select></Field>
        <Field label="Açıklama"><input value={f.description} onChange={set("description")} placeholder="Kısa açıklama" /></Field>
        <Field label="Tutar (₺)"><input type="number" min="0" value={f.amount} onChange={set("amount")} /></Field>
        {withBankUI ? (
          <>
            <div className="field" style={{ gridColumn: "1 / -1" }}>
              <span>Ödeme şekli</span>
              <div className="seg">
                <button type="button" className={!isBank ? "on" : ""} onClick={() => setF({ ...f, bankAccountId: "" })}><Banknote size={14} /> Nakit (kasa)</button>
                <button type="button" className={isBank ? "on" : ""} disabled={bankAccounts.length === 0} onClick={() => setF({ ...f, bankAccountId: bankAccounts[0]?.id || "" })}><Landmark size={14} /> Banka</button>
              </div>
              {bankAccounts.length === 0 && <span className="small">Banka seçmek için önce Banka sekmesinden hesap ekleyin.</span>}
            </div>
            {isBank && (
              <>
                <Field label="Banka hesabı">
                  <select value={f.bankAccountId} onChange={set("bankAccountId")}>
                    {bankAccounts.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
                  </select>
                </Field>
                <div className="bank-preview">
                  <span>{initial ? "Bu kayıt hariç bakiye" : "Güncel bakiye"}: <strong>{fmtTRY(current)}</strong></span>
                  <span>→</span>
                  <span>Bu gelirle: <strong>{fmtTRY(after)}</strong></span>
                </div>
              </>
            )}
          </>
        ) : (
          <Field label="Banka hesabı (opsiyonel)">
            <select value={f.bankAccountId} onChange={set("bankAccountId")}>
              <option value="">Seçilmedi (kasa/nakit)</option>
              {bankAccounts.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
            </select>
          </Field>
        )}
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button className="btn btn-primary" disabled={!f.amount || !f.description} onClick={() => onSave(f)}>Kaydet</button>
      </div>
    </Modal>
  );
}

function Banka({ data, update, bankBalance }) {
  const [accModal, setAccModal] = useState(false);
  const [editTx, setEditTx] = useState(null);
  const [txModal, setTxModal] = useState(null); // account
  const [transferModal, setTransferModal] = useState(false);
  const [activeAccount, setActiveAccount] = useState(data.bankAccounts[0]?.id || null);

  function addAccount(form) {
    update("bankAccounts", (arr) => [...arr, { ...form, id: uid() }]);
    setAccModal(false);
  }
  function removeAccount(id) {
    update("bankAccounts", (arr) => arr.filter((a) => a.id !== id));
    update("bankTransactions", (arr) => arr.filter((t) => t.accountId !== id));
    if (activeAccount === id) setActiveAccount(null);
  }
  function addTx(accountId, form) {
    update("bankTransactions", (arr) => [...arr, { id: uid(), accountId, source: "manuel", ...form }]);
    setTxModal(null);
  }
  function updateTx(id, form) {
    update("bankTransactions", (arr) => arr.map((t) => (t.id === id ? { ...t, ...form } : t)));
  }
  function deleteTx(id) {
    update("bankTransactions", (arr) => arr.filter((t) => t.id !== id));
  }
  function transfer(form) {
    const id = uid();
    update("bankTransactions", (arr) => [
      ...arr,
      { id: uid(), accountId: form.fromId, date: form.date, type: "cikis", amount: form.amount, description: `Transfer → ${form.toName}`, source: "transfer", relatedId: id },
      { id: uid(), accountId: form.toId, date: form.date, type: "giris", amount: form.amount, description: `Transfer ← ${form.fromName}`, source: "transfer", relatedId: id },
    ]);
    setTransferModal(false);
  }

  const account = data.bankAccounts.find((a) => a.id === activeAccount);
  const txs = account ? data.bankTransactions.filter((t) => t.accountId === account.id).sort((a, b) => b.date.localeCompare(a.date)) : [];

  return (
    <div className="page">
      <header className="page-head">
        <div><h1>Banka</h1><p className="muted">Hesaplar, işlemler ve transferler</p></div>
        <div className="head-actions">
          <button className="btn btn-ghost" onClick={() => setTransferModal(true)} disabled={data.bankAccounts.length < 2}><ArrowRightLeft size={15} /> Transfer</button>
          <button className="btn btn-primary" onClick={() => setAccModal(true)}><Plus size={16} /> Hesap ekle</button>
        </div>
      </header>

      {data.bankAccounts.length === 0 ? (
        <Empty icon={Landmark} title="Henüz banka hesabı yok" hint="Yeni hesap ekleyerek başlayın." />
      ) : (
        <>
          <div className="account-strip">
            {data.bankAccounts.map((a) => (
              <button key={a.id} className={"account-chip" + (activeAccount === a.id ? " active" : "")} onClick={() => setActiveAccount(a.id)}>
                <div className="account-chip-name">{a.name}</div>
                <div className="account-chip-bank muted small">{a.bankName}</div>
                <div className="account-chip-balance">{fmtTRY(bankBalance(a.id))}</div>
              </button>
            ))}
          </div>

          {account && (
            <div className="card">
              <div className="card-head">
                <div>
                  <h2>{account.name}</h2>
                  <p className="muted small mono">{account.iban}</p>
                </div>
                <div className="head-actions">
                  <button className="btn btn-ghost" onClick={() => setTxModal(account)}><Plus size={14} /> İşlem ekle</button>
                  <DangerButton onConfirm={() => removeAccount(account.id)} label="Hesabı sil" confirmLabel="Emin misiniz?" />
                </div>
              </div>
              {txs.length === 0 ? (
                <Empty icon={Banknote} title="Bu hesapta işlem yok" />
              ) : (
                <table className="table">
                  <thead><tr><th>Tarih</th><th>Açıklama</th><th>Kaynak</th><th className="num">Tutar</th><th></th></tr></thead>
                  <tbody>
                    {txs.map((t) => (
                      <tr key={t.id}>
                        <td>{fmtDate(t.date)}</td>
                        <td>{t.description}</td>
                        <td className="muted small">{t.source}</td>
                        <td className={"num " + (t.type === "giris" ? "pos" : "neg")}>{t.type === "giris" ? "+" : "-"}{fmtTRY(t.amount)}</td>
                        <td className="row-actions">{t.source === "manuel" && <><button className="icon-btn" title="Düzenle" onClick={() => setEditTx(t)}><Pencil size={15} /></button><DangerButton onConfirm={() => deleteTx(t.id)} confirmLabel="Sil?" /></>}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          )}
        </>
      )}

      {accModal && <BankAccountForm onCancel={() => setAccModal(false)} onSave={addAccount} />}
      {txModal && <BankTxForm account={txModal} onCancel={() => setTxModal(null)} onSave={(f) => addTx(txModal.id, f)} />}
      {editTx && account && <BankTxForm account={account} initial={editTx} onCancel={() => setEditTx(null)} onSave={(f) => { updateTx(editTx.id, f); setEditTx(null); }} />}
      {transferModal && <TransferForm accounts={data.bankAccounts} onCancel={() => setTransferModal(false)} onSave={transfer} />}
    </div>
  );
}

function BankAccountForm({ onCancel, onSave }) {
  const [f, setF] = useState({ name: "", bankName: "", iban: "", openingBalance: 0 });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.type === "number" ? Number(e.target.value) : e.target.value });
  return (
    <Modal title="Yeni banka hesabı" onClose={onCancel}>
      <div className="form-grid">
        <Field label="Hesap adı"><input value={f.name} onChange={set("name")} placeholder="Örn. İşletme Vadesiz" /></Field>
        <Field label="Banka adı"><input value={f.bankName} onChange={set("bankName")} /></Field>
        <Field label="IBAN"><input value={f.iban} onChange={set("iban")} placeholder="TR.." /></Field>
        <Field label="Açılış bakiyesi (₺)"><input type="number" value={f.openingBalance} onChange={set("openingBalance")} /></Field>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button className="btn btn-primary" disabled={!f.name} onClick={() => onSave(f)}>Kaydet</button>
      </div>
    </Modal>
  );
}

function BankTxForm({ account, initial, onCancel, onSave }) {
  const [f, setF] = useState(initial
    ? { date: initial.date, type: initial.type, amount: initial.amount, description: initial.description || "" }
    : { date: todayStr(), type: "giris", amount: 0, description: "" });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.type === "number" ? Number(e.target.value) : e.target.value });
  return (
    <Modal title={initial ? `İşlemi düzenle — ${account.name}` : `Yeni işlem — ${account.name}`} onClose={onCancel}>
      <div className="form-grid">
        <Field label="Tür">
          <select value={f.type} onChange={set("type")}>
            <option value="giris">Para girişi</option>
            <option value="cikis">Para çıkışı</option>
          </select>
        </Field>
        <Field label="Tarih"><input type="date" value={f.date} onChange={set("date")} /></Field>
        <Field label="Tutar (₺)"><input type="number" min="0" value={f.amount} onChange={set("amount")} /></Field>
        <Field label="Açıklama"><input value={f.description} onChange={set("description")} placeholder="Örn. Kira ödemesi" /></Field>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button className="btn btn-primary" disabled={!f.amount} onClick={() => onSave(f)}>Kaydet</button>
      </div>
    </Modal>
  );
}

function TransferForm({ accounts, onCancel, onSave }) {
  const [fromId, setFromId] = useState(accounts[0]?.id);
  const [toId, setToId] = useState(accounts[1]?.id || accounts[0]?.id);
  const [amount, setAmount] = useState(0);
  const [date, setDate] = useState(todayStr());
  const from = accounts.find((a) => a.id === fromId);
  const to = accounts.find((a) => a.id === toId);
  return (
    <Modal title="Hesaplar arası transfer" onClose={onCancel}>
      <div className="form-grid">
        <Field label="Gönderen hesap">
          <select value={fromId} onChange={(e) => setFromId(e.target.value)}>{accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}</select>
        </Field>
        <Field label="Alıcı hesap">
          <select value={toId} onChange={(e) => setToId(e.target.value)}>{accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}</select>
        </Field>
        <Field label="Tutar (₺)"><input type="number" min="0" value={amount} onChange={(e) => setAmount(Number(e.target.value))} /></Field>
        <Field label="Tarih"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Vazgeç</button>
        <button
          className="btn btn-primary"
          disabled={!amount || fromId === toId}
          onClick={() => onSave({ fromId, toId, amount, date, fromName: from?.name, toName: to?.name })}
        >
          Transfer et
        </button>
      </div>
    </Modal>
  );
}

.card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:18px 18px 6px; margin-bottom:16px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; }

.table{ width:100%; min-width:540px; border-collapse:collapse; font-size:13.5px; }
.table th{ text-align:left; font-weight:500; color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; padding:0 8px 8px; border-bottom:1px solid var(--line); }
.table th.num{ text-align:right; }
.table td{ padding:10px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
.table tr:last-child td{ border-bottom:none; }
.row-actions{ display:flex; gap:4px; justify-content:flex-end; white-space:nowrap; }

.icon-btn{ width:28px; height:28px; border-radius:7px; border:1px solid transparent; background:transparent; color:var(--ink-soft); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.icon-btn:hover{ background:var(--line-soft); }

.btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border-radius:8px; font-size:13.5px; font-weight:500; cursor:pointer; border:1px solid transparent; font-family:inherit; }
.btn-primary{ background:var(--brand); color:#fff; }
.btn-primary:hover{ background:var(--ink); }
.btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--text); }
.btn-ghost:hover{ background:var(--line-soft); }
.btn-ghost:disabled{ opacity:.4; cursor:not-allowed; }
.btn-ghost-danger{ background:transparent; border-color:var(--rust-soft); color:var(--rust); padding:6px 10px; font-size:12.5px; }
.btn-ghost-danger:hover{ background:var(--rust-soft); }
.btn-danger-solid{ background:var(--rust); color:#fff; padding:6px 10px; font-size:12.5px; }
.link-btn{ background:none; border:none; color:var(--brand); font-weight:500; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; padding:0; font-family:inherit; }

.toolbar{ margin-bottom:14px; }
.date-filter{ display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
.date-filter .field input{ min-width:150px; }
.search{ display:flex; align-items:center; gap:8px; background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; padding:8px 12px; max-width:320px; color:var(--muted); }
.search input{ border:none; background:none; outline:none; font-size:13.5px; width:100%; font-family:inherit; color:var(--text); }

.company-match-list{ margin-top:10px; border:1px solid var(--line); border-radius:8px; overflow:hidden; max-width:420px; }
.company-match-row{ display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; padding:10px 12px; border:none; border-bottom:1px solid var(--line-soft); background:#fff; cursor:pointer; font-family:inherit; font-size:13.5px; }
.company-match-row:last-child{ border-bottom:none; }
.company-match-row:hover{ background:var(--brand-soft); }

.empty{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:34px 10px; color:var(--muted); }
.empty-title{ font-weight:500; color:var(--ink-soft); }
.empty-hint{ font-size:12.5px; max-width:280px; }

.badge{ font-size:11.5px; padding:3px 8px; border-radius:20px; font-weight:500; }
.badge-pos{ background:var(--teal-soft); color:var(--teal); }
.badge-warn{ background:var(--amber-soft); color:var(--amber); }
.badge-neutral{ background:var(--brand-soft); color:var(--brand); }

.hint-banner{ background:var(--amber-soft); color:#8A5E13; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
.hint-banner.warn{ background:var(--rust-soft); color:var(--rust); }

/* category manager */
.category-card{ overflow:visible; }
.category-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.category-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--brand-soft); color:var(--ink); font-size:12.5px; font-weight:500; padding:6px 6px 6px 12px; border-radius:20px; }
.category-chip-editing{ background:#fff; border:1px solid var(--brand); padding:4px 6px 4px 10px; }
.category-chip-editing input{ border:none; outline:none; font-family:inherit; font-size:12.5px; font-weight:500; width:120px; background:transparent; color:var(--text); }
.category-chip-ok{ background:var(--teal-soft) !important; color:var(--teal) !important; }
.category-chip-x{ width:18px; height:18px; border-radius:50%; border:none; background:rgba(15,61,117,.12); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.category-chip-x:hover{ background:var(--rust); color:#fff; }
.category-add{ display:flex; align-items:center; gap:8px; border-top:1px solid var(--line-soft); padding-top:14px; }
.category-add input{ flex:1; min-width:0; font-family:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; }
.category-add input:focus{ outline:2px solid var(--brand); border-color:var(--brand); }

/* modal */
.ov{ position:fixed; inset:0; background:rgba(9,42,84,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal{ background:#fff; border-radius:12px; max-width:480px; width:100%; max-height:88vh; overflow:auto; box-shadow:0 20px 60px rgba(9,42,84,.3); }
.modal.wide{ max-width:680px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line-soft); position:sticky; top:0; background:#fff; }
.modal-body{ padding:20px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.field{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--muted); font-weight:500; }
.field input, .field select{ font-family:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; color:var(--text); background:#fff; }
.field input:focus, .field select:focus{ outline:2px solid var(--brand); outline-offset:0; border-color:var(--brand); }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

.section-title{ margin-top:20px; }
.line-items{ display:flex; flex-direction:column; gap:8px; }
.line-item{ display:grid; grid-template-columns:2fr 70px 90px 70px 90px 30px; gap:8px; align-items:center; }
.line-item select, .line-item input{ font-family:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
.line-item .line-total{ font-weight:500; }
.return-item{ grid-template-columns:2fr 100px 80px 100px; }
.grand-total{ text-align:right; margin-top:16px; padding-top:12px; border-top:1px solid var(--line); font-size:14px; }
.grand-total strong{ font-family:'IBM Plex Mono',monospace; font-size:19px; margin-left:8px; color:var(--ink); }

/* firmalar */
.company-row{ border-bottom:1px solid var(--line-soft); }
.company-row:last-child{ border-bottom:none; }
.company-summary{ display:grid; grid-template-columns:20px 1.4fr 1fr auto; gap:14px; align-items:center; padding:13px 4px; cursor:pointer; }
.company-chevron{ color:var(--muted); }
.balance-tag{ font-weight:500; }
.company-detail{ padding:0 4px 18px 34px; }
.company-detail-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px; font-size:13.5px; }
.mini-tables{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.mini-row{ display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:5px 0; border-bottom:1px solid var(--line-soft); }

/* banka */
.account-strip{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; }
.account-chip{ flex-shrink:0; min-width:170px; text-align:left; background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; font-family:inherit; }
.account-chip.active{ border-color:var(--brand); box-shadow:0 0 0 1px var(--brand); }
.account-chip-name{ font-weight:500; font-size:13.5px; }
.account-chip-balance{ font-family:'IBM Plex Mono',monospace; font-size:16px; margin-top:6px; color:var(--ink); }

@media (max-width:920px){
  .hamburger{ display:flex; }
  .scrim{ display:block; position:fixed; inset:0; background:rgba(9,42,84,.45); z-index:45; }
  .sidebar{ position:fixed; left:-260px; top:0; height:100vh; z-index:50; transition:left .2s ease; box-shadow:0 0 40px rgba(9,42,84,.35); }
  .sidebar.open{ left:0; }
  .sidebar-close{ display:flex; }
  .main{ padding:66px 14px 50px; }
  .page-head{ padding-right:0; }
  .export-fab{ top:14px; right:14px; padding:0; width:38px; height:38px; justify-content:center; border-radius:10px; }
  .export-fab-label{ display:none; }
  .form-grid{ grid-template-columns:1fr; }
  .line-item{ grid-template-columns:1fr; }
  .return-item{ grid-template-columns:1fr; }
  .company-summary{ grid-template-columns:16px 1fr; row-gap:8px; }
  .balance-tag{ grid-column:2; text-align:left; }
  .row-actions{ grid-column:2; justify-content:flex-start; }
  .company-detail{ padding-left:4px; }
  .company-detail-grid, .mini-tables{ grid-template-columns:1fr; }
  .account-chip{ min-width:150px; }
  .category-add{ flex-wrap:wrap; }
  .category-add input{ width:100%; }
}
.row-click{ cursor:pointer; }
.row-click:hover td{ background:var(--brand-soft); }
.year-select{ font-family:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; background:#fff; color:var(--text); }
.month-total td{ font-weight:600; border-top:2px solid var(--line); }
.seg{ display:inline-flex; width:max-content; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button{ font-family:inherit; display:flex; align-items:center; gap:6px; padding:8px 14px; font-size:13px; background:#fff; color:var(--muted); border:0; cursor:pointer; }
.seg button.on{ background:var(--brand); color:#fff; }
.seg button:disabled{ opacity:.45; cursor:not-allowed; }
.bank-preview{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; background:var(--brand-soft); color:var(--brand); border-radius:8px; padding:10px 14px; font-size:13px; }
.bank-preview strong{ font-family:'IBM Plex Mono',monospace; }
.bank-summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px; }
.bank-summary > div{ background:var(--paper-raised); border:1px solid var(--line); border-radius:8px; padding:10px 14px; display:flex; flex-direction:column; gap:3px; }
.bank-summary strong{ font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:500; }
@media (max-width:480px){
  h1{ font-size:22px; }
  .main{ padding:60px 10px 40px; }
  .stat-grid{ grid-template-columns:1fr 1fr; }
}
`;


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<DefterApp />);

</script>
